<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>GYMGUYZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Declara's shell (one sidebar in four sections + top bar with search, Declara AI and account) dressed as a neon training console.
   Looks are switched in Settings through data-look on <html>; the default Neon look is dark-first. */
:root{
  color-scheme: dark;
  --bg:#0b0d10; --frame:#13161b; --panel:#181c22; --panel-2:#20252d; --line:#2a3039;
  --fg:#eef2f5; --muted:#8e99a6; --dim:#5f6a77;
  --lime:#b4ff2e; --cyan:#22d3ee; --ink:#0b0d10; --on-type:#0b0d10;
  --tile-a:#141920; --tile-b:#0d1014;
  --stripe1:rgba(180,255,46,.08); --stripe2:rgba(34,211,238,.06);
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --font-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:10px;
  --side-bg:var(--frame); --side-fg:var(--fg); --side-muted:var(--muted); --side-dim:var(--dim); --side-line:var(--line);
  --side-on-fg:var(--lime); --side-on-bg:linear-gradient(90deg,color-mix(in srgb,var(--lime) 14%,transparent),transparent); --side-on-bar:var(--lime);
  --side-sub:var(--fg); --side-accent:var(--lime); --side-hex:var(--bg); --side-icon:currentColor;
  --top-bg:color-mix(in srgb,var(--bg) 88%,transparent); --top-fg:var(--fg); --top-muted:var(--muted); --top-accent:var(--lime); --top-field:var(--panel); --top-field-line:var(--line);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);
  background-image:linear-gradient(118deg,transparent 0 62%,var(--stripe1) 62% 64%,transparent 64% 100%),linear-gradient(118deg,transparent 0 70%,var(--stripe2) 70% 71%,transparent 71% 100%),linear-gradient(118deg,var(--stripe1) 0 6%,transparent 6% 100%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lime)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%;max-width:1640px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--side-bg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 14px;border-bottom:1px solid var(--side-line)}
.brand svg{flex:none}
.brand .hex{fill:var(--side-hex);stroke:var(--side-accent)}
.brand .dee{stroke:var(--side-fg)}
.brand .zap{fill:var(--side-accent)}
.brand b{display:block;font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.04em;line-height:1}
.brand b{color:var(--side-fg)}
.brand b span{color:var(--side-accent)}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;line-height:1.3}
.brand.has-logo{flex-direction:column;align-items:flex-start}
.brand.has-logo svg{display:none}
.brand-logo{display:block;max-width:100%;max-height:72px;object-fit:contain}
.brand.has-logo small em{color:var(--side-fg);font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.04em}
.brand small em{font-style:normal;color:var(--side-sub);letter-spacing:.02em;text-transform:none;font-size:12.5px}
.nav{display:flex;flex-direction:column;padding:8px 0;flex:1;overflow:auto}
.nav-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-dim);padding:14px 22px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 20px;color:var(--side-muted);text-decoration:none;font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.02em;border-left:4px solid transparent}
.nav a:hover{color:var(--side-fg);background:color-mix(in srgb,var(--side-fg) 7%,transparent)}
.nav a.on{color:var(--side-on-fg);background:var(--side-on-bg);border-left-color:var(--side-on-bar)}
.nav a svg{width:20px;height:20px;flex:none;color:var(--side-icon)}
.nav a.on svg{color:inherit}
.nav .badge{margin-left:auto;font-family:var(--font-body);font-size:11px;font-weight:600;background:var(--lime);color:var(--ink);border-radius:20px;padding:1px 8px}
.side-foot{padding:10px 18px 0;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px}
.side-foot .live{font-size:13px;color:var(--side-muted)}
.side-foot .live b{color:var(--side-fg)}
.linkbtn{background:none;border:0;padding:0;color:var(--side-dim);font-size:12px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--side-fg)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--top-bg);color:var(--top-fg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:28px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.top h1 em{font-style:normal;color:var(--top-accent)}
.sample{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--top-muted);border:1px dashed currentColor;border-radius:20px;padding:2px 9px;white-space:nowrap}
.search{position:relative;margin-left:auto;flex:1 1 220px;max-width:320px;min-width:160px}
.search input{width:100%;background:var(--top-field);color:var(--fg);border:1px solid var(--top-field-line);border-radius:30px;padding:9px 14px 9px 36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;z-index:40}
.results button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:9px 12px;text-align:left}
.results button:hover,.results button:focus-visible{background:color-mix(in srgb,var(--lime) 10%,transparent)}
.results small{color:var(--muted);margin-left:auto;font-size:12px}
.clock{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--top-muted);white-space:nowrap;letter-spacing:.03em}
.ai-btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--lime),var(--cyan));color:var(--ink);border:0;border-radius:30px;padding:8px 14px;font-weight:700;font-family:var(--font-display);font-size:17px;letter-spacing:.04em;white-space:nowrap}
.ai-btn svg{width:17px;height:17px}
.bell{position:relative;background:var(--top-field);color:var(--fg);border:1px solid var(--top-field-line);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px}
.bell i{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.me{position:relative}
.me > button{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;text-align:left}
.me .av{width:40px;height:40px;font-size:16px}
.me .un{line-height:1.15;white-space:nowrap}
.me .un b{display:block;font-weight:600;font-size:14px}
.me .un em{display:block;font-style:normal;color:var(--top-muted);font-size:12px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);min-width:230px;box-shadow:0 18px 40px rgba(0,0,0,.35);z-index:45;overflow:hidden}
.menu button,.menu a{display:block;width:100%;background:none;border:0;padding:10px 14px;text-align:left;color:var(--fg);text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:color-mix(in srgb,var(--lime) 10%,transparent)}
.preview{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--cyan) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);border-radius:12px;padding:10px 14px;font-size:14px}
.preview .btn{margin-left:auto}

#view{padding:22px 28px 48px;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:600}
.page-head h2{font-size:34px;line-height:1.05;text-transform:uppercase}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:75ch;font-size:14px}
.page-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- neon KPI tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.tile-wrap{--c:var(--lime);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 40%,transparent));position:relative}
.tile-frame{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent) 55%,var(--c));padding:2px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.tile{background:linear-gradient(180deg,var(--tile-a),var(--tile-b));clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);padding:16px 14px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:164px;justify-content:space-between}
.tile-wrap::after{content:"";position:absolute;top:-7px;right:14px;width:46px;height:5px;background:repeating-linear-gradient(118deg,var(--c) 0 7px,transparent 7px 11px)}
.tile .lbl{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile .val{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.01em}
.tile .val small{font-size:20px;color:var(--muted);font-weight:600}
.tile .sub{font-size:12px;color:var(--muted)}
.tile .sub b{color:var(--c);font-weight:600}

/* ---------- panels ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.panel-h .meta{color:var(--muted);font-size:13px}
.panel-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.info{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
.pill.mute{color:var(--muted);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.pill.live{color:var(--lime);background:color-mix(in srgb,var(--lime) 13%,transparent)}
.pill.live::before{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg);white-space:nowrap;border-left:3px solid var(--tc,var(--muted))}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select,.field input,.field select,.field textarea,.fld{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0;color:var(--fg)}
.toolbar input[type=search]{width:240px;max-width:100%}
.toolbar .count{color:var(--muted);font-size:13px;margin-left:auto}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:6px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:color-mix(in srgb,var(--lime) 5%,transparent)}
tr.total td{font-weight:700;background:var(--panel-2)}
td.r,th.r{text-align:right}
.muted{color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;min-width:180px}
.who b{display:block;font-weight:600;white-space:nowrap}
.who small{display:block;color:var(--muted);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex:none;color:#0b0d10}
.bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--lime),var(--cyan))}
.bar.hot i{background:var(--warn)}
.util{display:flex;align-items:center;gap:8px}
.util span{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.more{display:flex;justify-content:center;padding:12px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:10px;padding:10px 12px;border-left:4px solid var(--s,var(--muted));text-decoration:none;color:inherit}
.alert:hover{background:color-mix(in srgb,var(--fg) 6%,var(--panel-2))}
.alert b{font-family:var(--font-display);font-size:26px;font-weight:700;min-width:36px;text-align:center;color:var(--s)}
.alert div{min-width:0}
.alert strong{display:block;font-weight:600}
.alert small{color:var(--muted);font-size:12.5px}
.alert svg{margin-left:auto;width:18px;height:18px;color:var(--muted);flex:none}

.livestats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.livestats div{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.livestats b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.05}
.livestats small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.feed{display:flex;flex-direction:column;max-height:260px;overflow:auto;padding-right:4px}
.feed button{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left}
.feed button:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.feed .t{font-family:var(--font-display);font-size:16px;color:var(--muted)}
.feed .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .w small{color:var(--muted)}
svg text{font-family:var(--font-body)}
.chart{width:100%;height:auto;display:block}

.lb{display:flex;flex-direction:column;gap:4px}
.lb button{display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;padding:6px 4px;border-radius:8px;text-align:left}
.lb button:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.lb .rk{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--dim);text-align:center}
.lb button:first-child .rk{color:var(--lime)}
.lb .nm{min-width:0}
.lb .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lb .nm small{color:var(--muted);font-size:12px}
.lb .sc{text-align:right;font-family:var(--font-display);font-size:22px;font-weight:700}
.lb .sc small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:400}

.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center;font-size:14px}
.hbar .track{height:16px;border-radius:4px;background:color-mix(in srgb,var(--fg) 6%,transparent);overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.hbar .v{text-align:right;color:var(--muted);font-size:13px}
.hbar .v b{color:var(--fg)}

.banner{position:relative;overflow:hidden;border-radius:14px;padding:26px 28px;min-height:180px;display:flex;flex-direction:column;justify-content:center;color:#fff;
  background:linear-gradient(118deg,transparent 0 58%,color-mix(in srgb,var(--lime) 90%,transparent) 58% 59.2%,transparent 59.2% 64%,color-mix(in srgb,var(--cyan) 80%,transparent) 64% 64.8%,transparent 64.8%),radial-gradient(circle at 85% 50%,rgba(34,211,238,.35),transparent 55%),linear-gradient(135deg,#0b2a4a,#0a1a30 60%,#071222);border:1px solid #1d3b5c}
.banner::before{content:"";position:absolute;left:0;top:0;width:90px;height:90px;background:linear-gradient(135deg,var(--lime) 0 30%,transparent 30%)}
.banner .big{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:46px;line-height:.95;text-transform:uppercase;position:relative}
.banner .tag{font-family:var(--font-display);font-style:italic;font-weight:800;color:var(--lime);font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;position:relative}
.banner .spot{position:relative;margin-top:14px;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.35);border-radius:10px;padding:10px 12px;max-width:460px}
.banner .spot small{color:#b8c7d6;display:block;font-size:12px}
.banner .spot b{font-weight:600}
.banner .bolt{position:absolute;right:26px;top:50%;transform:translateY(-50%);width:120px;height:120px;color:var(--lime);opacity:.9}

/* schedule */
.days{display:flex;gap:8px;flex-wrap:wrap}
.days button{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:76px;line-height:1.15}
.days button b{display:block;font-family:var(--font-display);font-size:16px;letter-spacing:.06em}
.days button small{color:var(--muted);font-size:12px}
.days button.on{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 12%,var(--panel-2))}
.days button.on b{color:var(--lime)}
.days button.today small{color:var(--cyan)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.board{min-width:980px}
.bhead,.brow{display:grid;grid-template-columns:200px minmax(0,1fr)}
.bhead{position:sticky;top:0;background:var(--panel-2);z-index:2}
.bhead .hrs{position:relative;height:30px}
.bhead .hrs span{position:absolute;top:7px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.brow{border-top:1px solid var(--line);min-height:44px}
.brow .bn{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;cursor:pointer;min-width:0}
.brow .bn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brow .bn small{color:var(--muted);font-size:11px;display:block}
.brow .bn .av{width:28px;height:28px;font-size:12px}
.trk{position:relative;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/15))}
.blk{position:absolute;top:6px;bottom:6px;border-radius:6px;border:0;color:var(--on-type);font-size:11px;font-weight:600;padding:2px 6px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3}
.blk small{display:block;font-weight:500;opacity:.8}
.blk.cx{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--fg) 9%,transparent) 0 6px,transparent 6px 12px)!important;color:var(--muted);outline:1px dashed var(--dim)}
.blk.ns{outline:2px solid var(--bad);opacity:.6}
.blk.ip{box-shadow:0 0 0 2px var(--fg),0 0 16px var(--lime)}
.blk.done{opacity:.55}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1;pointer-events:none}
.leave{color:var(--dim);font-size:12px;padding:12px 10px}
.week{display:grid;grid-template-columns:44px repeat(7,minmax(110px,1fr));min-width:860px}
.week .wh{text-align:center;padding:8px 4px;font-family:var(--font-display);color:var(--muted);font-size:16px;letter-spacing:.06em;border-bottom:1px solid var(--line);line-height:1.1}
.week .wh small{display:block;font-family:var(--font-body);font-size:12px}
.week .wh.today{color:var(--lime)}
.week .ax{position:relative}
.week .ax span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.week .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 44px)}
.week .blk{left:4px;right:4px;top:auto;bottom:auto;white-space:normal;text-align:center;display:flex;flex-direction:column;justify-content:center;font-family:var(--font-display);font-size:16px}
.week .blk small{font-family:var(--font-body);font-size:11px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:flex-start;gap:10px}
.card-h b{font-size:17px;font-weight:600;display:block}
.card-h small{color:var(--muted);font-size:12.5px}
.card-h .pill{margin-left:auto}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.match{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px}
.mrow b{font-weight:600;display:block}
.mrow small{color:var(--muted);font-size:12px;display:block}
.score{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--lime);text-align:right;line-height:1}
.score small{font-family:var(--font-body);font-size:10px;color:var(--muted);font-weight:400}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:block}
.stat b{font-family:var(--font-display);font-size:34px;line-height:1.1;display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.warn b{color:var(--warn)}.stat.good b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.cc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.cc small{color:var(--muted);font-size:12px}

/* checklist */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;cursor:pointer}
.check:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--lime);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check small{display:block;color:var(--muted);font-size:12px;text-decoration:none}

/* chat */
.chat{display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:540px}
.chans{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--frame)}
.chans h3{font-size:13px;letter-spacing:.14em;color:var(--dim);padding:6px 10px;text-transform:uppercase}
.chans button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;display:flex;gap:8px}
.chans button.on{background:color-mix(in srgb,var(--lime) 14%,transparent);color:var(--lime)}
.chans button small{margin-left:auto;font-weight:400}
.msgs{display:flex;flex-direction:column;min-width:0}
.msgs-h{padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs-h b{font-family:var(--font-display);font-size:20px;letter-spacing:.04em}
.msgs-h small{color:var(--muted);display:block}
.stream{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;max-height:520px}
.msg{display:flex;gap:10px}
.msg .av{width:32px;height:32px;font-size:13px}
.msg b{font-weight:600}
.msg time{color:var(--muted);font-size:12px;margin-left:6px}
.msg p{margin:2px 0 0;max-width:70ch}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0}

/* AI panel */
.ai{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(420px,calc(100% - 32px));height:min(620px,calc(100% - 100px));background:var(--frame);border:1px solid var(--line);border-radius:18px;z-index:70;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.ai-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--lime) 18%,transparent),color-mix(in srgb,var(--cyan) 12%,transparent))}
.ai-h b{font-family:var(--font-display);font-size:22px;letter-spacing:.04em}
.ai-h small{display:block;color:var(--muted);font-size:12px}
.ai-log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ai-me{align-self:flex-end;background:var(--lime);color:var(--ink);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:85%;font-weight:500}
.ai-bot{align-self:flex-start;background:var(--panel-2);border-radius:14px 14px 14px 4px;padding:10px 12px;max-width:92%;font-size:14px}
.ai-bot ul{margin:6px 0 0;padding-left:18px}
.ai-bot li{margin:2px 0}
.ai-bot .go{display:inline-block;margin-top:8px}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.ai-chips button{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px;color:var(--fg)}
.ai-chips button:hover{border-color:var(--lime)}
.ai form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ai form input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:30px;padding:9px 14px;color:var(--fg)}

/* settings */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.look{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.look.on{border-color:var(--lime)}
.look b{font-weight:600}
.look small{color:var(--muted);font-size:12px}
.look .fs{font-size:30px;line-height:1;color:var(--lime)}
.sec-t{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 0 10px}
.sec-t + .looks{margin-bottom:18px}
.sw{display:flex;gap:4px}
.sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(127,127,127,.3)}
.access td{white-space:nowrap}
.access input{accent-color:var(--lime);width:16px;height:16px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--frame);border-left:1px solid var(--line);z-index:61;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;gap:18px;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.d-h{display:flex;gap:14px;align-items:center}
.d-h .av{width:56px;height:56px;font-size:22px}
.d-h h2{font-size:28px;line-height:1}
.d-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.x{margin-left:auto;align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.d-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.d-stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.d-stats small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.d-stats b{font-family:var(--font-display);font-size:26px;line-height:1.1}
.sec h3{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list > *{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:var(--fg)}
.list > *:first-child{border-top:0}
.list button:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.list .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.list small{color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--frame);border:1px solid var(--line);border-radius:16px;z-index:62;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h2{font-size:26px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{font-size:15px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--lime);color:var(--ink);font-weight:600;border-radius:30px;padding:10px 20px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.empty{color:var(--muted);text-align:center;padding:28px;font-size:14px}
.note{color:var(--muted);font-size:13px;margin:0}
.prose{max-width:72ch;line-height:1.6}
.prose ol,.prose ul{padding-left:20px;margin:6px 0}
.prose li{margin:4px 0}

/* Blush: the house theme. Pink sidebar and top bar, near-white page, rose-framed KPI cards with clipped corners, the revenue card highlighted */
:root[data-look="blush"]{color-scheme:light;--bg:#fdf2f4;--frame:#f9c9d1;--panel:#fffafb;--panel-2:#fbe4e8;--line:#f3c6cf;--fg:#1f1a1c;--muted:#6b4d55;--dim:#f2b8c3;--lime:#e0607a;--cyan:#e98a9d;--ink:#ffffff;--tile-a:#fde7eb;--tile-b:#fde7eb;--stripe1:rgba(240,163,177,.16);--stripe2:rgba(240,163,177,.10);--ok:#2e9e5b;--warn:#c27a12;--bad:#d0344f;
  --side-bg:#f8c6cf;--side-fg:#1f1a1c;--side-muted:#1f1a1c;--side-dim:#1f1a1c;--side-line:#f1b2bf;--side-on-bg:#fffafb;--side-on-fg:#1f1a1c;--side-on-bar:transparent;--side-sub:#c8102e;--side-accent:#e0607a;--side-hex:#fffafb;--side-icon:#1f1a1c;
  --top-bg:#f9cdd5;--top-fg:#1f1a1c;--top-muted:#6b4d55;--top-accent:#1f1a1c;--top-field:#fde9ed;--top-field-line:#f1b2bf}
:root[data-look="blush"] .side{border-right:1px solid #f1b2bf}
:root[data-look="blush"] .nav-h{font-size:13px;letter-spacing:.1em;font-weight:600;padding-left:20px}
:root[data-look="blush"] .nav a{font-weight:500;border-left:0;margin:2px 14px 2px 0;border-radius:0 12px 12px 0;padding:9px 20px}
:root[data-look="blush"] .nav a.on{box-shadow:0 2px 8px rgba(200,71,95,.12)}
:root[data-look="blush"] .nav a.on svg{color:#e0607a}
:root[data-look="blush"] .nav a:hover:not(.on){background:rgba(255,250,251,.55)}
:root[data-look="blush"] .top{border-bottom:0;backdrop-filter:none}
:root[data-look="blush"] .top h1{font-size:32px}
:root[data-look="blush"] .search input{background:#fde9ed;border-radius:999px}
:root[data-look="blush"] .bell{background:#fffafb}
:root[data-look="blush"] .ai-btn{background:#e0607a;color:#fff}
:root[data-look="blush"] .tile-wrap{filter:none}
:root[data-look="blush"] .tile-frame,:root[data-look="blush"] .tile{height:100%}
:root[data-look="blush"] .tile-wrap::after{display:none}
:root[data-look="blush"] .tile-frame{background:#e88a9c}
:root[data-look="blush"] .tile svg{color:#e0607a}
:root[data-look="blush"] .tile .sub{font-family:var(--font-display);font-size:16px;color:#1f1a1c;font-weight:500}
:root[data-look="blush"] .tile .sub b{color:#e0607a}
:root[data-look="blush"] .tile .sub b.up{color:var(--ok)}
:root[data-look="blush"] .tile .sub b.down{color:var(--bad)}
:root[data-look="blush"] .tile .val small{color:#1f1a1c;font-weight:500}
:root[data-look="blush"] .tile-wrap.hi{filter:drop-shadow(0 8px 16px rgba(200,71,95,.22))}
:root[data-look="blush"] .tile-wrap.hi .tile-frame{background:#c8475f}
:root[data-look="blush"] .tile-wrap.hi .tile{background:#f6bcc8}
:root[data-look="blush"] .panel{border-radius:16px}
:root[data-look="blush"] .livestats div{background:#fbe4e8}
:root[data-look="blush"] .banner{color:#2b2226;border-color:var(--line);background:repeating-linear-gradient(118deg,rgba(217,70,107,0) 0 22px,rgba(217,70,107,.16) 22px 26px),linear-gradient(135deg,#fde7eb,#f4b3c1 70%,#ee9fb1)}
:root[data-look="blush"] .banner::before{background:linear-gradient(135deg,#e0607a 0 30%,transparent 30%)}
:root[data-look="blush"] .banner .tag{color:#c8102e}
:root[data-look="blush"] .banner .bolt{color:#e0607a}
:root[data-look="blush"] .banner .spot{background:rgba(255,255,255,.6)}
:root[data-look="blush"] .banner .spot small{color:#8a5664}
/* lead cards (layout for every theme; Blush colours below) */
.btn.outline{background:transparent;border:2px solid var(--line);color:var(--lime)}
.btn.outline:hover{border-color:var(--lime)}
.lead{padding:22px 24px;gap:14px;border-radius:18px}
.lead .card-h{align-items:center;gap:14px}
.lead .card-h .av{width:52px;height:52px;font-size:20px}
.lead .card-h b{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.lead .card-h small{font-family:var(--font-display);font-size:18px;color:var(--fg);font-weight:500}
.lead .card-h .pill{align-self:flex-start;font-size:14px;padding:4px 12px}
.lead .kv{font-family:var(--font-display);font-size:18px;gap:6px 24px;font-weight:500}
.lead .kv dt{color:var(--fg)}
.lead .actions .btn{font-family:var(--font-display);font-size:18px;font-weight:600;padding:7px 20px;border-radius:10px;letter-spacing:.02em}
.mascot,.banner-mascot{display:none}
:root[data-look="blush"] .lead{background:#fffafb;border:2px solid #f0bcc6}
:root[data-look="blush"] .lead .av.soft{background:#f7cdd5!important;color:#8a2c40}
:root[data-look="blush"] .lead .pill.ok{color:#2e9e5b;background:#dff3e6}
:root[data-look="blush"] .lead .pill.warn{color:#e2780f;background:#fde7d2}
:root[data-look="blush"] .lead .btn.primary{background:#ee8a9d;border-color:#ee8a9d;color:#fff}
:root[data-look="blush"] .lead .btn.outline{border-color:#f0bcc6;color:#e0607a;background:#fffafb}
:root[data-look="blush"] #pageTitle[data-v="leads"],:root[data-look="blush"] #pageTitle[data-v="leads"] em{color:#c8304f}
:root[data-look="blush"] .top h1{font-weight:800;letter-spacing:.01em}
:root[data-look="blush"] .mascot{display:block;align-self:flex-end;height:150px;width:auto;margin:-46px -4px -12px 0;pointer-events:none}
:root[data-look="blush"] .side-foot{position:relative;padding-bottom:10px}
:root[data-look="blush"] .side-foot .live,:root[data-look="blush"] .side-foot .linkbtn{padding-right:78px}
:root[data-look="blush"] .banner-mascot{display:block;position:absolute;right:28px;bottom:-30px;height:250px;width:auto;pointer-events:none}
:root[data-look="blush"] .banner .bolt{display:none}
:root[data-look="blush"] .brand.has-logo{padding-top:8px;padding-bottom:16px}
:root[data-look="blush"] .brand-logo{max-height:84px}
@media (max-width:900px){:root[data-look="blush"] .mascot{display:none}}
@media (max-width:560px){:root[data-look="blush"] .banner-mascot{height:150px;right:6px;bottom:-14px;opacity:.9}:root[data-look="blush"] .banner .big,:root[data-look="blush"] .banner .tag{max-width:65%}}
/* ================= Declara themes (Settings > Appearance), ported from the Declara app ================= */
/* Dark Mode */
:root[data-look="dark"]{--bg:#0b1020;--frame:#101728;--panel:#151c2e;--panel-2:#1b2338;--line:#2a3450;--fg:#e9eefb;--muted:#9fb2d8;--dim:#6d7fa8;--lime:#7c9bff;--cyan:#3ddcb4;--ink:#0b1020;--tile-a:#151c2e;--tile-b:#151c2e;--stripe1:transparent;--stripe2:transparent;
  --side-bg:linear-gradient(170deg,#161e33,#101728 55%,#070b16);--side-fg:#fff;--side-muted:#c3d0ec;--side-dim:#7e8fb5;--side-line:#232c45;--side-on-bg:#1f2a4a;--side-on-fg:#7c9bff;--side-on-bar:#7c9bff;--side-sub:#ffeb2e;--side-accent:#7c9bff;--side-hex:#0b1020;
  --top-bg:rgba(11,16,32,.85);--top-field:#151c2e}
/* Declara Blue (the original Declara look) */
:root[data-look="declara"]{color-scheme:light;--bg:#f4f7fd;--frame:#fff;--panel:#fff;--panel-2:#f6f8fe;--line:#e3e8f3;--fg:#16213e;--muted:#5d6b8a;--dim:#8d99b3;--lime:#1a4be6;--cyan:#01bcaf;--ink:#fff;--tile-a:#fff;--tile-b:#fff;--stripe1:transparent;--stripe2:transparent;--ok:#1f9d63;--warn:#c7771b;--bad:#c0392b;
  --side-bg:linear-gradient(170deg,#123c9f,#09429f 55%,#071d73);--side-fg:#fff;--side-muted:rgba(255,255,255,.82);--side-dim:rgba(255,255,255,.55);--side-line:rgba(255,255,255,.16);--side-on-bg:#164fec;--side-on-fg:#fff;--side-on-bar:#ffeb2e;--side-sub:#ffeb2e;--side-accent:#ffeb2e;--side-hex:#071d73;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const weekStart = d => addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()), -((d.getDay()+6)%7));
const daysUntil = s => Math.round((parse(s) - today0())/DAY);
const nowMin = () => { const n = new Date(); return n.getHours()*60+n.getMinutes(); };
const money = n => '$'+Math.round(n).toLocaleString('en-US');
const moneyK = n => n >= 10000 ? '$'+(n/1000).toFixed(n>=100000?0:1)+'k' : money(n);
const fmtT = m => { let h = Math.floor(m/60); const mm = m%60; const ap = h>=12?'p':'a'; h = h%12||12; return h+(mm?':'+pad(mm):'')+ap; };
const fmtTL = m => { let h = Math.floor(m/60); const mm = m%60; const ap = h>=12?'PM':'AM'; h = h%12||12; return h+':'+pad(mm)+' '+ap; };
const fmtD = (s, o = {month:'short',day:'numeric'}) => parse(s).toLocaleDateString('en-US',o);
const ago = s => { const d = -daysUntil(s); return d<=0?'Today':d===1?'Yesterday':d+' days ago'; };
const initials = p => ((p.first||'?')[0]+((p.last||'')[0]||(p.first||'?')[1]||'')).toUpperCase();
const fullName = p => p ? (p.first+(p.last?' '+p.last:'')) : 'Unknown';
const avColor = id => `hsl(${hash(id)%360} 70% 72%)`;
const av = (p, cls='') => `<span class="av ${cls}" style="background:${avColor(p.id)}">${esc(initials(p))}</span>`;
const inSeason = l => { if (!l.season) return true; const n=new Date(); const md=pad(n.getMonth()+1)+'-'+pad(n.getDate()); const [a,b]=l.season; return a<=b ? md>=a&&md<=b : md>=a||md<=b; };

/* ================= data generation ================= */
function generate(seed, roster){
  const real = Array.isArray(roster) && roster.length > 0; const N = real ? roster.length : 100;
  const r = rng(seed), pick = a => a[Math.floor(r()*a.length)], rint = (a,b) => a+Math.floor(r()*(b-a+1));
  const t0 = today0();
  const expiry = max => { const x = r(); return ymd(addDays(t0, x<.04 ? -rint(3,60) : x<.11 ? rint(0,30) : rint(31,max))); };
  const statuses = Array(N).fill('Active');
  if (!real){ for (let i=0;i<8;i++) statuses[i]='Onboarding'; for (let i=8;i<12;i++) statuses[i]='On leave'; }
  for (let i=statuses.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[statuses[i],statuses[j]]=[statuses[j],statuses[i]];}
  const used = new Set(), trainers = [];
  for (let i=0;i<N;i++){
    let first,last; if (real){ first = roster[i].first; last = roster[i].last; } else { do{first=pick(FIRST);last=pick(LAST)}while(used.has(first+last)); used.add(first+last); }
    const zf = real ? zoneFor(roster[i].address) : {zone:pick(ZONES), guess:false};
    const s1 = pick(SPECS); let s2; do{s2=pick(SPECS)}while(s2===s1);
    const status = statuses[i];
    const training = {}; const doneN = status==='Onboarding' ? rint(1,7) : MODULES.length;
    MODULES.forEach((m,k) => { training[m.id] = k < doneN; });
    trainers.push({
      id:'T'+String(i+1).padStart(3,'0'), first, last, zone:zf.zone, zoneGuess:zf.guess, birthday: real ? roster[i].birthday : '', address: real ? roster[i].address : '', real, specs:[s1,s2], cert:pick(CERTS),
      certExp:expiry(720), cprExp:expiry(700), bgCheck:ymd(addDays(t0, r()<.04 ? -rint(366,420) : -rint(5,340))), insExp:expiry(360),
      status, hired:ymd(addDays(t0, status==='Onboarding' ? -rint(2,25) : -rint(60,1900))),
      rate:rint(40,58), capacity:rint(18,30), radius:rint(8,20), rating:+(4.3+r()*.7).toFixed(1),
      phone: real ? '' : `(${pick(['408','669','650'])}) 555-01${pad(rint(0,99))}`, training
    });
  }
  const clients = []; let cn = 0;
  const pkgKeys = ['p10','p10','p10','p20','p20','m8','m8','m8','m12','m12','duo'];
  for (const t of trainers){
    const n = t.status==='Active' ? rint(5,9) : t.status==='Onboarding' ? rint(0,2) : 0;
    for (let k=0;k<n;k++){
      const pk = pick(pkgKeys);
      const goalOpts = GOALS.map((g,i)=>i).filter(i => t.specs.includes(GOALS[i].s));
      const goal = r()<.72 && goalOpts.length ? pick(goalOpts) : Math.floor(r()*GOALS.length);
      const lapsed = r()<.05, paused = !lapsed && r()<.04;
      cn++;
      clients.push({
        id:'C'+String(cn).padStart(4,'0'), first:pick(CFIRST), last:pick(LAST), zone: r()<.85 || !NEIGHBORS[t.zone].length ? t.zone : pick(NEIGHBORS[t.zone]),
        street:`${rint(100,9899)} ${pick(STREETS)}`, trainerId:t.id, pkg:pk, remaining: r()<.08 ? rint(1,2) : rint(3,PACKAGES[pk].size),
        goal, slot:pick(['Mornings','Mornings','Midday','Evenings','Evenings']), status: paused ? 'Paused' : 'Active', lapsed,
        since: ymd(addDays(t0,-rint(14,900))), lastSeen: ymd(addDays(t0, lapsed ? -rint(11,32) : -rint(4,8)))
      });
    }
  }
  const leads = [];
  for (let i=0;i<9;i++){
    leads.push({id:'L'+(i+1), first:pick(CFIRST), last:pick(LAST), zone:pick(ZONES), goal:Math.floor(r()*GOALS.length), slot:pick(Object.keys(SLOTS)),
      pkg:pick(['p10','p20','m8','m12','duo']), source:pick(SOURCES), received:Date.now()-rint(1,70)*3600000,
      note:pick(['Has dumbbells and a bench at home','Apartment, no equipment','Garage gym','Wants to start next week','Referred by current client','Recovering from knee replacement','Prefers a female trainer','Works from home, flexible'])});
  }
  // sales funnel for the month so far
  const dim = new Date(t0.getFullYear(), t0.getMonth()+1, 0).getDate(); const frac = Math.max(.12, t0.getDate()/dim);
  const sales = {month: ymd(t0).slice(0,7), bySource:{}};
  const weights = {Website:46,Referral:22,Instagram:30,Google:34,'Client referral':18,'Physician referral':9};
  for (const s of SOURCES){ const leadsN = Math.max(2, Math.round(weights[s]*frac*(0.85+r()*.3))); const consults = Math.round(leadsN*(s.includes('referral')||s==='Referral'?.78:.55)); const signed = Math.round(consults*(s.includes('referral')||s==='Referral'?.7:.45)); sales.bySource[s] = {leads:leadsN, consults, signed, pkgRev: signed*rint(700,1100)}; }
  // work queue
  const WORK = [
    ['Client fell during session: file incident report','Compliance','High',0,'U1'],
    ['Trainer coverage for clients of trainers on leave','Scheduling','High',0,'U2'],
    ['Client wants to move to evenings','Scheduling','Normal',1,'U2'],
    ['Refund request for 3 unused sessions','Billing','Normal',2,'U1'],
    ['Collect signed liability waiver from new client','Client care','High',-1,'U3'],
    ['Certificate of insurance for condo gym access','Compliance','Normal',3,'U1'],
    ['Follow up on 2-star review','Client care','High',-2,'U3'],
    ['Order 10 replacement foam rollers and bands','Equipment','Low',6,'U4'],
    ['Book CPR/AED class for the onboarding group','Training','Normal',5,'U4'],
    ['Background check results pending for new hire','HR','Normal',2,'U4'],
    ['Update price sheet for Partner 10-Packs','Billing','Low',9,'U0'],
    ['Ride-along: pair new trainer with a senior trainer','Training','Normal',4,'U4'],
    ['Mileage reimbursement question','Payroll','Low',3,'U1'],
    ['Drop off adjustable dumbbells at a client\'s home','Equipment','Normal',1,'U2'],
    ['Send monthly progress reports to Partner-pack clients','Client care','Low',2,'U3'],
    ['Confirm doctor\'s clearance before a post-rehab client\'s next session','Compliance','High',0,'U3'],
    ['Quarterly pricing review','Billing','Normal',-3,'U0'],
    ['Plan the November trainer meetup','HR','Low',12,'U0']

function buildWeek(st){
  const ws = weekStart(new Date());
  st.weekStart = ymd(ws);
  const r = rng(st.seed + hash(st.weekStart));
  const rint = (a,b) => a+Math.floor(r()*(b-a+1));
  const tById = Object.fromEntries(st.trainers.map(t=>[t.id,t]));
  const busy = {}; const out = [];
  const tIdx = Math.round((today0()-ws)/DAY); const nm = nowMin();
  const patterns = {m12:[[0,2,4],[1,3,5]], m8:[[0,3],[1,4],[2,5],[0,2]]};
  for (const c of st.clients){
    const t = tById[c.trainerId];
    if (!t || t.status==='On leave' || c.status!=='Active' || c.lapsed) continue;
    const per = {p10:r()<.5?1:2, p20:2, m8:2, m12:3, duo:1}[c.pkg] || 1;
    let days;
    if (patterns[c.pkg]) { const p = patterns[c.pkg]; days = p[Math.floor(r()*p.length)]; }
    else { const pool=[0,1,2,3,4,5,6].filter(d => d<6 || r()<.3); days=[]; while(days.length<per && pool.length){ days.push(pool.splice(Math.floor(r()*pool.length),1)[0]); } }
    const [lo,hi] = SLOTS[c.slot];
    const goalSpec = GOALS[c.goal].s; const type = t.specs.includes(goalSpec) ? goalSpec : t.specs[0];
    for (const d of days){
      const date = ymd(addDays(ws,d)); const list = busy[t.id+'|'+date] || (busy[t.id+'|'+date]=[]);
      let start = lo + 30*rint(0,(hi-lo)/30), ok = false;
      for (let tries=0; tries<10; tries++){
        if (start>=360 && start<=1200 && !list.some(([a,b]) => start < b+30 && start+60 > a-30)) { ok = true; break; }
        start = lo + 30*rint(0,(hi-lo)/30) + (tries>4 ? (r()<.5?-120:120) : 0);
      }
      if (!ok) continue;
      list.push([start,start+60]);
      let status = 'Scheduled';
      if (d < tIdx || (d===tIdx && start+60 <= nm)){ const x=r(); status = x<.92?'Completed':x<.97?'Cancelled':'No-show'; }
      else if (r()<.03) status = 'Cancelled';
      out.push({id:'S'+(st.nextId.s++), trainerId:t.id, clientId:c.id, date, start, dur:60, type, status});
    }
  }
  st.sessions = out;
  const cur = out.filter(s=>s.status!=='Cancelled').reduce((a,s)=>a+sessionRevenue(s, st),0);
  st.history = [];
  for (let i=11;i>=1;i--) st.history.push({week:ymd(addDays(ws,-7*i)), rev:Math.round(cur*(1 - i*0.018 + (r()-.5)*.05))});
}

function hourChart(hours, vals, nm){
  const W=640,H=120,pl=26,pb=20,pt=8; const max=Math.max(4,...vals); const step=Math.ceil(max/4/2)*2||1; const top=step*4;

  const cur=Math.floor(nm/60);
  const bars=hours.map((h,i)=>{ const x=pl+i*bw+bw*.18, w=bw*.64, yy=y(vals[i]); const c=h===cur?'var(--lime)':h<cur?'var(--dim)':'var(--cyan)';
    return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-pb-yy)}" rx="3" fill="${c}"><title>${fmtT(h*60)}: ${vals[i]} sessions</title></rect>${i%2===0?`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtT(h*60)}</text>`:''}`; }).join('');

}
function niceStep(max){ const mag=Math.pow(10,Math.floor(Math.log10(Math.max(1,max)/4))); return Math.ceil(max/4/mag)*mag; }
function revChart(series){
  const W=520,H=230,pl=46,pb=34,pt=16,pr=8; const max=Math.max(...series.map(s=>s.v));
  const step=niceStep(max), top=step*4; const y=v=>pt+(H-pt-pb)*(1-v/top); const bw=(W-pl-pr)/series.length;
  let g=''; for(let v=0;v<=top;v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?'$'+(v/1000)+'k':'$'+v}</text>`;
  const bars=series.map((s,i)=>{ const x=pl+i*bw+bw*.2,w=bw*.6,yy=y(s.v);
    return `<rect x="${x}" y="${yy}" width="${w}" height="${H-pb-yy}" rx="3" fill="url(#rg)" opacity="${s.cur?1:.55}"><title>Week of ${fmtD(s.w)}: ${money(s.v)}</title></rect>${s.cur?`<text x="${x+w/2}" y="${yy-6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--lime)">${moneyK(s.v)}</text>`:''}${i%3===2||s.cur?`<text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle" font-size="10.5" fill="${s.cur?'var(--fg)':'var(--muted)'}">${s.cur?'This wk':fmtD(s.w)}</text>`:''}`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Booked revenue per week"><defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lime)"/><stop offset="1" style="stop-color:var(--cyan)"/></linearGradient></defs>${g}${bars}</svg>`;
}

/* ================= Performance: Sales KPIs ================= */
function vSales(){

  const month = parse(S.sales.month+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const pkgMix = Object.keys(PACKAGES).map(k=>({k, n:S.clients.filter(c=>c.pkg===k&&c.status==='Active').length}));

  <div class="grid">

    <section class="panel c12"><div class="panel-h"><h2>By source</h2><div class="right"><a class="btn sm primary" href="#leads">Match waiting leads</a></div></div>

      ${SOURCES.map(s=>{const x=src[s];return `<tr><td>${s}</td><td class="r num">${x.leads}</td><td class="r num">${x.consults}</td><td class="r num">${x.signed}</td><td class="r num">${Math.round(x.signed/Math.max(1,x.leads)*100)}%</td><td class="r num">${money(x.pkgRev)}</td></tr>`;}).join('')}

/* ================= Business: Leads ================= */
function matchesFor(lead){
  const st = stats(); const spec = GOALS[lead.goal].s;
  return S.trainers.filter(t=>t.status!=='On leave' && compWorst(t)!=='bad').map(t => {
    const open = Math.max(0, t.capacity - st[t.id].booked);
    const zoneScore = t.zone===lead.zone ? 40 : NEIGHBORS[lead.zone].includes(t.zone) ? 20 : 0;
    const specScore = t.specs[0]===spec ? 30 : t.specs.includes(spec) ? 24 : 0;
    const score = Math.round(zoneScore + specScore + Math.min(20, open/t.capacity*30) + (t.rating-4.3)*14);
    const why = [];
    if (zoneScore===40) why.push('Covers '+lead.zone); else if (zoneScore) why.push('Next door in '+t.zone);
    if (specScore) why.push(spec+' specialist');
    why.push(open+' open slots', t.rating.toFixed(1)+'★');
    return {t, score:Math.min(99,score), why, open};
  }).filter(m=>m.open>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

/* ================= Business: Payroll ================= */
function payFor(t, st){
  const b = st[t.id]; const ns = b.noshow; const remaining = Math.max(0,b.booked - b.done - ns);
  const base = b.done*t.rate + ns*t.rate*.5; const travel = (b.done+ns)*4;
  const bonus = b.done+remaining>=18 && t.rating>=4.8 ? 75 : 0;
  const toDate = base + travel; const proj = toDate + remaining*(t.rate+4) + bonus;
  return {done:b.done, ns, remaining, base, travel, bonus, toDate, proj, rev:b.rev};
}
function vPayroll(){
  const st = stats(); const rows = S.trainers.filter(t=>t.status!=='On leave').map(t=>({t, p:payFor(t,st)})).sort((a,b)=>b.p.proj-a.p.proj);
  const sum = k => rows.reduce((a,r)=>a+r.p[k],0);
  const rev = sum('rev'), proj = sum('proj'); const margin = rev ? (rev-proj)/rev*100 : 0;
  const end = fmtD(ymd(addDays(parse(S.weekStart),6)));
  return head('Business','Trainer payroll','Trainers are paid weekly, per completed session.') + `<div class="strip">
    ${stat('Earned to date',money(sum('toDate')),`${sum('done')} sessions completed`)}${stat('Projected payroll',money(proj),`Week ending ${end}`)}${stat('Booked revenue',money(rev),'Same week, all clients')}${stat('Gross margin',margin.toFixed(1)+'%','Revenue minus trainer pay',margin>=40?'good':'warn')}</div>
  <section class="panel">
    <div class="panel-h"><h2>Pay period ${fmtD(S.weekStart)} – ${end}</h2><span class="meta">No-shows pay 50% · $4 travel per visit · $75 bonus at 18+ sessions with a 4.8+ rating</span><div class="right"><button class="btn" data-act="csv">Copy as CSV</button></div></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Trainer</th><th class="r">Rate</th><th class="r">Done</th><th class="r">No-show</th><th class="r">Still booked</th><th class="r">Session pay</th><th class="r">Travel</th><th class="r">Bonus</th><th class="r">Earned</th><th class="r">Projected</th></tr></thead>
      <tbody>${rows.map(({t,p})=>`<tr data-act="trainer" data-id="${t.id}"><td><div class="who">${av(t)}<div><b>${esc(fullName(t))}</b><small>${t.id} · ${esc(t.zone)}</small></div></div></td>
        <td class="r num">${money(t.rate)}</td><td class="r num">${p.done}</td><td class="r num">${p.ns||'–'}</td><td class="r num">${p.remaining}</td><td class="r num">${money(p.base)}</td><td class="r num">${money(p.travel)}</td><td class="r num">${p.bonus?money(p.bonus):'–'}</td><td class="r num">${money(p.toDate)}</td><td class="r num"><b>${money(p.proj)}</b></td></tr>`).join('')}
      <tr class="total"><td>${rows.length} trainers</td><td></td><td class="r num">${sum('done')}</td><td class="r num">${sum('ns')}</td><td class="r num">${sum('remaining')}</td><td class="r num">${money(sum('base'))}</td><td class="r num">${money(sum('travel'))}</td><td class="r num">${money(sum('bonus'))}</td><td class="r num">${money(sum('toDate'))}</td><td class="r num">${money(proj)}</td></tr>
      </tbody></table></div></section>`;
}
const csvLine = r => r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',');
function payrollCsv(){
  const st = stats(); const lines = [['Trainer ID','Trainer','Zone','Rate','Completed','No-shows','Still booked','Session pay','Travel','Bonus','Earned to date','Projected']];
  for (const t of S.trainers.filter(t=>t.status!=='On leave')){ const p = payFor(t,st); lines.push([t.id,fullName(t),t.zone,t.rate,p.done,p.ns,p.remaining,p.base.toFixed(2),p.travel.toFixed(2),p.bonus.toFixed(2),p.toDate.toFixed(2),p.proj.toFixed(2)]); }

  const q = qRaw.toLowerCase(); const st = stats(); const ti = todayIdx();
  const zone = ZONES.find(z=>q.includes(z.toLowerCase()));
  let day = /today/.test(q) ? ti : /tomorrow/.test(q) ? ti+1 : DOW_FULL.findIndex(d=>q.includes(d)||new RegExp('\\b'+d.slice(0,3)+'\\b').test(q));
  const slot = /morning|early/.test(q)?'Mornings':/midday|noon|lunch|afternoon/.test(q)?'Midday':/evening|night|after work/.test(q)?'Evenings':null;
  const spec = SPECS.find(s=>SPEC_WORDS[s].test(q));
  if (/free|available|open|who can (take|cover)/.test(q) && !/slot/.test(q.replace('open slots',''))){
    if (day<0) day = ti; if (day>6) return 'I can only see this week\'s schedule. Ask about a day from Monday to Sunday.';
    const date = ymd(addDays(parse(S.weekStart),day)); const [lo,hi] = slot ? SLOTS[slot] : [360,1170];
    const res = S.trainers.filter(t=>t.status!=='On leave'&&compWorst(t)!=='bad'&&(!zone||t.zone===zone||NEIGHBORS[zone].includes(t.zone))&&(!spec||t.specs.includes(spec))).map(t=>{ let first=null; for(let m=lo;m<=hi;m+=30){ if(!conflicts(t.id,date,m,60)){ first=m; break; } } return {t, first, near:zone&&t.zone===zone}; }).filter(x=>x.first!==null && (day!==ti || x.first>nowMin())).sort((a,b)=>b.near-a.near||util(a.t,st)-util(b.t,st));
    if (!res.length) return 'Nobody matching that is free then. Try a neighboring zone or another time of day.';
    return `${res.length} trainers are free ${DOW_FULL[day][0].toUpperCase()+DOW_FULL[day].slice(1)}${slot?' '+slot.toLowerCase():''}${zone?` in or next to ${zone}`:''}${spec?` who do ${spec}`:''}. Least booked first:`+ul(res.map(x=>`<b>${esc(fullName(x.t))}</b> · ${esc(x.t.zone)} · free from ${fmtT(x.first)} · ${st[x.t.id].booked}/${x.t.capacity} booked`),8)+goBtn('#schedule','Open dispatch board');
  }
  if (/cpr|cert|insur|background|expire|compliance|document/.test(q)){
    const k = /cpr|aed/.test(q)?'cpr':/insur/.test(q)?'ins':/background/.test(q)?'bg':/cert/.test(q)?'cert':null;
    const rows = []; for (const t of S.trainers) for (const x of compItems(t)) if ((!k||x.k===k) && (/expir(ing|e soon)|soon|30/.test(q) ? x.state==='warn' : /expired/.test(q) ? x.state==='bad' : x.state!=='ok')) rows.push({t,x});
    rows.sort((a,b)=>a.x.days-b.x.days);
    return rows.length ? `${rows.length} found:`+ul(rows.map(({t,x})=>`<b>${esc(fullName(t))}</b> · ${esc(x.label)} · ${x.days<0?'expired '+fmtD(x.exp):x.days+' days left'}`))+goBtn('#compliance','Open Certifications') : 'Nothing found. Everyone is current for that.';
  }
  if (/birthday|bday/.test(q)){ const r = upcomingBirthdays(/month|30/.test(q)?30:60); return r.length ? 'Coming up:'+ul(r.map(({t,b})=>`<b>${esc(fullName(t))}</b> · ${b.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} · turns ${b.age}${b.inDays===0?' · <b>today</b>':''}`)) : (S.trainers.some(t=>t.birthday) ? 'No trainer birthdays in the next 60 days.' : 'No birthdays on file. Import your roster in Settings.'); }
  if (/top|best|leader|rank|most sessions/.test(q)){
    const r = S.trainers.filter(t=>t.status==='Active').sort((a,b)=>st[b.id].done-st[a.id].done||b.rating-a.rating).slice(0,5);
    return 'Most sessions completed this week:'+ul(r.map((t,i)=>`${i+1}. <b>${esc(fullName(t))}</b> · ${st[t.id].done} done · ${t.rating.toFixed(1)}★ · ${esc(t.zone)}`));
  }
  if (/risk|lapsed|haven.?t (seen|trained)|losing/.test(q)){ const r = S.clients.filter(c=>clientState(c)==='At risk'); return r.length?`${r.length} clients have gone 10+ days without a session and nothing is booked:`+ul(r.map(c=>`<b>${esc(fullName(c))}</b> · last session ${ago(lastSession(c)).toLowerCase()} · ${esc(fullName(T(c.trainerId)))}`))+goBtn('#clients','Open client book'):'No clients are at risk right now.'; }
  if (/renew|ending|package|running out/.test(q)){ const r = S.clients.filter(c=>clientState(c)==='Renew soon'); return `${r.length} clients have 2 or fewer sessions left:`+ul(r.map(c=>`<b>${esc(fullName(c))}</b> · ${c.remaining} left on ${esc(PACKAGES[c.pkg].short)} · ${esc(fullName(T(c.trainerId)))}`))+goBtn('#clients','Open client book'); }
  if (/payroll|pay|wages/.test(q)){ const rows = S.trainers.filter(t=>t.status!=='On leave').map(t=>payFor(t,st)); const tot = k=>rows.reduce((a,p)=>a+p[k],0); return `Trainers have earned <b>${money(tot('toDate'))}</b> so far this week. Projected for the full week: <b>${money(tot('proj'))}</b>, against ${money(tot('rev'))} in booked revenue.`+goBtn('#payroll','Open Trainer Payroll'); }
  if (/revenue|sales|income|made/.test(q)){ const rev = S.sessions.filter(billable).reduce((a,s)=>a+sessionRevenue(s),0); return `Booked revenue this week is <b>${money(rev)}</b> from ${S.sessions.filter(billable).length} sessions.`+goBtn('#dashboard','Open dashboard'); }
  if (/lead/.test(q)){ return S.leads.length?`${S.leads.length} leads are waiting:`+ul(S.leads.map(l=>`<b>${esc(fullName(l))}</b> · ${esc(l.zone)} · ${esc(GOALS[l.goal].g)}`))+goBtn('#leads','Match leads'):'No leads waiting.'; }
  if (/overdue|late|ticket|work/.test(q)){ const r = S.work.filter(w=>!w.done&&daysUntil(w.due)<0); return r.length?`${r.length} overdue tickets:`+ul(r.map(w=>`<b>${esc(w.name)}</b> · ${esc(fullName(P(w.assignee)))} · due ${fmtD(w.due)}`))+goBtn('#work','Open Work & Tickets'):'Nothing is overdue.'; }
  if (zone && /cover|who|trainers? in|work in/.test(q)){ const r = S.trainers.filter(t=>t.zone===zone&&t.status!=='On leave'); return `${r.length} trainers are based in ${zone}:`+ul(r.map(t=>`<b>${esc(fullName(t))}</b> · ${t.specs.join(', ')} · ${st[t.id].booked}/${t.capacity} booked`),12); }
  const words = q.replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const t = S.trainers.find(t=>words.includes(t.last.toLowerCase())&&words.includes(t.first.toLowerCase())) || S.trainers.find(t=>words.includes(t.last.toLowerCase()));
  if (t){ const w = compWorst(t); return `<b>${esc(fullName(t))}</b> · ${t.status} · ${esc(t.zone)} · ${t.specs.join(' & ')}<br>${st[t.id].booked}/${t.capacity} booked this week, ${st[t.id].done} done, ${st[t.id].clients} clients, ${t.rating.toFixed(1)}★. Documents: ${w==='ok'?'all current':w==='warn'?'something expires within 30 days':'<b>something has expired</b>'}${t.phone?'. Phone '+esc(t.phone):''}.<br><button class="btn sm go" data-act="trainer" data-id="${t.id}">Open profile</button>`; }
  const c = S.clients.find(c=>words.includes(c.last.toLowerCase())&&words.includes(c.first.toLowerCase()));
  if (c){ const nx = nextSession(c); return `<b>${esc(fullName(c))}</b> · ${esc(c.street)}, ${esc(c.zone)} · ${clientState(c)}<br>Trains with ${esc(fullName(T(c.trainerId)))} · ${c.remaining} sessions left on ${esc(PACKAGES[c.pkg].short)} · next session ${nx?DOW[dayIndex(nx)]+' '+fmtT(nx.start):'not booked'}.<br><button class="btn sm go" data-act="client" data-id="${c.id}">Open client</button>`; }
  return 'I didn\'t find an answer for that. I can tell you who is free at a given time and zone, whose documents are expiring, top trainers, at-risk clients, renewals, payroll, revenue, leads and overdue tickets, or look up any trainer or client by name.';
}

function progressChart(c){
  const r = rng(hash(c.id)); const spec = GOALS[c.goal].s; const n = 8;
  let label, unit, v, stepFn;
  if (spec==='Weight Loss'){ label='Body weight'; unit='lb'; v=170+Math.round(r()*70); stepFn=()=>-(0.4+r()*1.6); }
  else if (['Strength','Sports Performance','HIIT','Boxing'].includes(spec)){ label='Goblet squat'; unit='lb'; v=20+Math.round(r()*25); stepFn=()=>r()<.2?0:2.5*(1+Math.floor(r()*2)); }
  else { label='Mobility score'; unit='points'; v=38+Math.round(r()*20); stepFn=()=>Math.round(r()*5); }
  const pts=[]; for(let i=0;i<n;i++){ pts.push(+v.toFixed(1)); v+=stepFn(); }
  const W=440,H=130,pl=40,pr=40,pt=18,pb=22; const lo=Math.min(...pts), hi=Math.max(...pts); const pd=(hi-lo)*.2||2; const a=Math.floor(lo-pd), b=Math.ceil(hi+pd);
  const x=i=>pl+i*(W-pl-pr)/(n-1), y=val=>pt+(H-pt-pb)*(1-(val-a)/(b-a));
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(' ');
  const delta=pts[n-1]-pts[0];
  return `<div class="sec"><h3>${label} · last 8 weeks</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} trend">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cyan);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--cyan);stop-opacity:0"/></linearGradient></defs>
    ${[a,b].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    <path d="${line} L${x(n-1)},${H-pb} L${x(0)},${H-pb} Z" fill="url(#pg)"/><path d="${line}" fill="none" stroke="var(--cyan)" stroke-width="2.5"/>
    <circle cx="${x(n-1)}" cy="${y(pts[n-1])}" r="5" fill="var(--lime)"/><text x="${x(n-1)}" y="${y(pts[n-1])-10}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--lime)">${pts[n-1]}</text>
    <text x="${pl}" y="${H-5}" font-size="10.5" fill="var(--muted)">8 wks ago</text><text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="10.5" fill="var(--muted)">This week</text>
  </svg><p class="note">${delta>=0?'+':''}${delta.toFixed(1)} ${unit} since the first check-in shown. Example trend.</p></div>`;
}
