<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Declara Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Declara's shell (one sidebar in four sections + top bar with search, Declara AI and account) dressed as a neon training console.
   Looks are switched in Settings through data-look on <html>; the default Neon look is dark-first. */
:root{
  color-scheme: dark;
  --bg:#0b0d10; --frame:#13161b; --panel:#181c22; --panel-2:#20252d; --line:#2a3039;
  --fg:#eef2f5; --muted:#8e99a6; --dim:#5f6a77;
  --lime:#b4ff2e; --cyan:#22d3ee; --ink:#0b0d10; --on-type:#0b0d10;
  --tile-a:#141920; --tile-b:#0d1014;
  --stripe1:rgba(180,255,46,.08); --stripe2:rgba(34,211,238,.06);
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --font-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:10px;
}
:root[data-look="midnight"]{--bg:#0b1020;--frame:#10172a;--panel:#151c2e;--panel-2:#1c2540;--line:#28324f;--fg:#e9eefb;--muted:#8fa6d8;--dim:#5d6c93;--lime:#5b7bff;--cyan:#8fa6d8;--ink:#ffffff;--tile-a:#162040;--tile-b:#0e1529;--stripe1:rgba(91,123,255,.08);--stripe2:rgba(143,166,216,.05)}
:root[data-look="declara"]{color-scheme:light;--bg:#eefaff;--frame:#ffffff;--panel:#ffffff;--panel-2:#f1f6fe;--line:#d3e0f3;--fg:#0d1b3d;--muted:#5a6b8c;--dim:#8a99b5;--lime:#164fec;--cyan:#4d60ff;--ink:#ffffff;--tile-a:#ffffff;--tile-b:#eef4ff;--stripe1:rgba(22,79,236,.07);--stripe2:rgba(77,96,255,.05);--ok:#0f9d6b;--warn:#b7791f;--bad:#d93654}
:root[data-look="blush"]{color-scheme:light;--bg:#f6bfca;--frame:#fbe4e8;--panel:#fdf0f2;--panel-2:#f9dde3;--line:#efb6c2;--fg:#2b2226;--muted:#8a5664;--dim:#b8808e;--lime:#d9466b;--cyan:#c8102e;--ink:#ffffff;--tile-a:#fff6f8;--tile-b:#fbe3e8;--stripe1:rgba(217,70,107,.10);--stripe2:rgba(255,255,255,.35);--ok:#22875e;--warn:#b26a00;--bad:#c8102e}
:root[data-look="blush"] .tile-wrap{filter:drop-shadow(0 6px 14px rgba(200,16,46,.14))}
:root[data-look="blush"] .tile svg{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:50%;padding:9px;width:46px;height:46px}
:root[data-look="blush"] .banner{color:#2b2226;border-color:var(--line);background:repeating-linear-gradient(118deg,rgba(217,70,107,.0) 0 22px,rgba(217,70,107,.16) 22px 26px),linear-gradient(135deg,#fbe4e8,#f4b3c1 70%,#ee9fb1)}
:root[data-look="blush"] .banner::before{background:linear-gradient(135deg,#d9466b 0 30%,transparent 30%)}
:root[data-look="blush"] .banner .tag{color:#c8102e}
:root[data-look="blush"] .banner .spot{background:rgba(255,255,255,.6)}
:root[data-look="blush"] .banner .spot small{color:#8a5664}
:root[data-look="blush"] .top h1 em,:root[data-look="blush"] .brand b span{color:#c8102e}
:root[data-look="halloween"]{--bg:#140826;--frame:#1c0b33;--panel:#2a1245;--panel-2:#34185a;--line:#44236e;--fg:#f3e6cf;--muted:#c3a9d8;--dim:#8a6aa8;--lime:#f07a12;--cyan:#6bd13a;--ink:#1c0b33;--tile-a:#2e1450;--tile-b:#1a0a30;--stripe1:rgba(240,122,18,.09);--stripe2:rgba(107,209,58,.06)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);
  background-image:linear-gradient(118deg,transparent 0 62%,var(--stripe1) 62% 64%,transparent 64% 100%),linear-gradient(118deg,transparent 0 70%,var(--stripe2) 70% 71%,transparent 71% 100%),linear-gradient(118deg,var(--stripe1) 0 6%,transparent 6% 100%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lime)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%;max-width:1640px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--frame);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 14px;border-bottom:1px solid var(--line)}
.brand svg{flex:none}
.brand .hex{fill:var(--bg);stroke:var(--lime)}
.brand .dee{stroke:var(--fg)}
.brand .zap{fill:var(--lime)}
.brand b{display:block;font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.04em;line-height:1}
.brand b span{color:var(--lime)}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;line-height:1.3}
.brand small em{font-style:normal;color:var(--fg);letter-spacing:.02em;text-transform:none;font-size:12.5px}
.nav{display:flex;flex-direction:column;padding:8px 0;flex:1;overflow:auto}
.nav-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:14px 22px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 20px;color:var(--muted);text-decoration:none;font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.02em;border-left:4px solid transparent}
.nav a:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 4%,transparent)}
.nav a.on{color:var(--lime);background:linear-gradient(90deg,color-mix(in srgb,var(--lime) 14%,transparent),transparent);border-left-color:var(--lime)}
.nav a svg{width:20px;height:20px;flex:none}
.nav .badge{margin-left:auto;font-family:var(--font-body);font-size:11px;font-weight:600;background:var(--lime);color:var(--ink);border-radius:20px;padding:1px 8px}
.side-foot{padding:10px 18px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot .live{font-size:13px;color:var(--muted)}
.side-foot .live b{color:var(--fg)}
.linkbtn{background:none;border:0;padding:0;color:var(--dim);font-size:12px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--fg)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:28px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.top h1 em{font-style:normal;color:var(--lime)}
.sample{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
.search{position:relative;margin-left:auto;flex:1 1 220px;max-width:320px;min-width:160px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:9px 14px 9px 36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;z-index:40}
.results button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:9px 12px;text-align:left}
.results button:hover,.results button:focus-visible{background:color-mix(in srgb,var(--lime) 10%,transparent)}
.results small{color:var(--muted);margin-left:auto;font-size:12px}
.clock{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
.ai-btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--lime),var(--cyan));color:var(--ink);border:0;border-radius:30px;padding:8px 14px;font-weight:700;font-family:var(--font-display);font-size:17px;letter-spacing:.04em;white-space:nowrap}
.ai-btn svg{width:17px;height:17px}
.bell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px}
.bell i{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.me{position:relative}
.me > button{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;text-align:left}
.me .av{width:40px;height:40px;font-size:16px}
.me .un{line-height:1.15;white-space:nowrap}
.me .un b{display:block;font-weight:600;font-size:14px}
.me .un em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);min-width:230px;box-shadow:0 18px 40px rgba(0,0,0,.35);z-index:45;overflow:hidden}
.menu button,.menu a{display:block;width:100%;background:none;border:0;padding:10px 14px;text-align:left;color:var(--fg);text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:color-mix(in srgb,var(--lime) 10%,transparent)}
.preview{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--cyan) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);border-radius:12px;padding:10px 14px;font-size:14px}
.preview .btn{margin-left:auto}

#view{padding:22px 28px 48px;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:600}
.page-head h2{font-size:34px;line-height:1.05;text-transform:uppercase}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:75ch;font-size:14px}
.page-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- neon KPI tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.tile-wrap{--c:var(--lime);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 40%,transparent));position:relative}
.tile-frame{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent) 55%,var(--c));padding:2px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.tile{background:linear-gradient(180deg,var(--tile-a),var(--tile-b));clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);padding:16px 14px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:164px;justify-content:space-between}
.tile-wrap::after{content:"";position:absolute;top:-7px;right:14px;width:46px;height:5px;background:repeating-linear-gradient(118deg,var(--c) 0 7px,transparent 7px 11px)}
.tile .lbl{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile .val{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.01em}
.tile .val small{font-size:20px;color:var(--muted);font-weight:600}
.tile .sub{font-size:12px;color:var(--muted)}
.tile .sub b{color:var(--c);font-weight:600}

/* ---------- panels ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.panel-h .meta{color:var(--muted);font-size:13px}
.panel-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.info{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
.pill.mute{color:var(--muted);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.pill.live{color:var(--lime);background:color-mix(in srgb,var(--lime) 13%,transparent)}
.pill.live::before{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg);white-space:nowrap;border-left:3px solid var(--tc,var(--muted))}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select,.field input,.field select,.field textarea,.fld{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0;color:var(--fg)}
.toolbar input[type=search]{width:240px;max-width:100%}
.toolbar .count{color:var(--muted);font-size:13px;margin-left:auto}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:6px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:color-mix(in srgb,var(--lime) 5%,transparent)}
tr.total td{font-weight:700;background:var(--panel-2)}
td.r,th.r{text-align:right}
.muted{color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;min-width:180px}
.who b{display:block;font-weight:600;white-space:nowrap}
.who small{display:block;color:var(--muted);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex:none;color:#0b0d10}
.bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--lime),var(--cyan))}
.bar.hot i{background:var(--warn)}
.util{display:flex;align-items:center;gap:8px}
.util span{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.more{display:flex;justify-content:center;padding:12px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:10px;padding:10px 12px;border-left:4px solid var(--s,var(--muted));text-decoration:none;color:inherit}
.alert:hover{background:color-mix(in srgb,var(--fg) 6%,var(--panel-2))}
.alert b{font-family:var(--font-display);font-size:26px;font-weight:700;min-width:36px;text-align:center;color:var(--s)}
.alert div{min-width:0}
.alert strong{display:block;font-weight:600}
.alert small{color:var(--muted);font-size:12.5px}
.alert svg{margin-left:auto;width:18px;height:18px;color:var(--muted);flex:none}

.livestats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.livestats div{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.livestats b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.05}
.livestats small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.feed{display:flex;flex-direction:column;max-height:260px;overflow:auto;padding-right:4px}
.feed button{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left}
.feed button:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.feed .t{font-family:var(--font-display);font-size:16px;color:var(--muted)}
.feed .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .w small{color:var(--muted)}
svg text{font-family:var(--font-body)}
.chart{width:100%;height:auto;display:block}

.lb{display:flex;flex-direction:column;gap:4px}
.lb button{display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;padding:6px 4px;border-radius:8px;text-align:left}
.lb button:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.lb .rk{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--dim);text-align:center}
.lb button:first-child .rk{color:var(--lime)}
.lb .nm{min-width:0}
.lb .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lb .nm small{color:var(--muted);font-size:12px}
.lb .sc{text-align:right;font-family:var(--font-display);font-size:22px;font-weight:700}
.lb .sc small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:400}

.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center;font-size:14px}
.hbar .track{height:16px;border-radius:4px;background:color-mix(in srgb,var(--fg) 6%,transparent);overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.hbar .v{text-align:right;color:var(--muted);font-size:13px}
.hbar .v b{color:var(--fg)}

.banner{position:relative;overflow:hidden;border-radius:14px;padding:26px 28px;min-height:180px;display:flex;flex-direction:column;justify-content:center;color:#fff;
  background:linear-gradient(118deg,transparent 0 58%,color-mix(in srgb,var(--lime) 90%,transparent) 58% 59.2%,transparent 59.2% 64%,color-mix(in srgb,var(--cyan) 80%,transparent) 64% 64.8%,transparent 64.8%),radial-gradient(circle at 85% 50%,rgba(34,211,238,.35),transparent 55%),linear-gradient(135deg,#0b2a4a,#0a1a30 60%,#071222);border:1px solid #1d3b5c}
.banner::before{content:"";position:absolute;left:0;top:0;width:90px;height:90px;background:linear-gradient(135deg,var(--lime) 0 30%,transparent 30%)}
.banner .big{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:46px;line-height:.95;text-transform:uppercase;position:relative}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

function buildWeek(st){
  const ws = weekStart(new Date());
  st.weekStart = ymd(ws);
  const r = rng(st.seed + hash(st.weekStart));
  const rint = (a,b) => a+Math.floor(r()*(b-a+1));
  const tById = Object.fromEntries(st.trainers.map(t=>[t.id,t]));
  const busy = {}; const out = [];
  const tIdx = Math.round((today0()-ws)/DAY); const nm = nowMin();
  const patterns = {m12:[[0,2,4],[1,3,5]], m8:[[0,3],[1,4],[2,5],[0,2]]};
  for (const c of st.clients){
    const t = tById[c.trainerId];
    if (!t || t.status==='On leave' || c.status!=='Active' || c.lapsed) continue;
    const per = {p10:r()<.5?1:2, p20:2, m8:2, m12:3, duo:1}[c.pkg] || 1;
    let days;
    if (patterns[c.pkg]) { const p = patterns[c.pkg]; days = p[Math.floor(r()*p.length)]; }
    else { const pool=[0,1,2,3,4,5,6].filter(d => d<6 || r()<.3); days=[]; while(days.length<per && pool.length){ days.push(pool.splice(Math.floor(r()*pool.length),1)[0]); } }
    const [lo,hi] = SLOTS[c.slot];
    const goalSpec = GOALS[c.goal].s; const type = t.specs.includes(goalSpec) ? goalSpec : t.specs[0];
    for (const d of days){
      const date = ymd(addDays(ws,d)); const list = busy[t.id+'|'+date] || (busy[t.id+'|'+date]=[]);
      let start = lo + 30*rint(0,(hi-lo)/30), ok = false;
      for (let tries=0; tries<10; tries++){
        if (start>=360 && start<=1200 && !list.some(([a,b]) => start < b+30 && start+60 > a-30)) { ok = true; break; }
        start = lo + 30*rint(0,(hi-lo)/30) + (tries>4 ? (r()<.5?-120:120) : 0);
      }
      if (!ok) continue;
      list.push([start,start+60]);
      let status = 'Scheduled';
      if (d < tIdx || (d===tIdx && start+60 <= nm)){ const x=r(); status = x<.92?'Completed':x<.97?'Cancelled':'No-show'; }
      else if (r()<.03) status = 'Cancelled';
      out.push({id:'S'+(st.nextId.s++), trainerId:t.id, clientId:c.id, date, start, dur:60, type, status});
    }
  }
  st.sessions = out;
  const cur = out.filter(s=>s.status!=='Cancelled').reduce((a,s)=>a+sessionRevenue(s, st),0);
  st.history = [];
  for (let i=11;i>=1;i--) st.history.push({week:ymd(addDays(ws,-7*i)), rev:Math.round(cur*(1 - i*0.018 + (r()-.5)*.05))});
}

  if (S.weekStart !== ymd(weekStart(new Date()))) buildWeek(S);
  if (S.sales.month !== ymd(today0()).slice(0,7)) { const g = generate(S.seed); S.sales = g.sales; }
  save();
}
function save(){ lsSet(KEY, JSON.stringify(S)); }
const T = id => S.trainers.find(t=>t.id===id);

function splitName(n){ const p = n.trim().split(/\s+/); return {first:p[0]||'Owner', last:p.slice(1).join(' ')}; }
function sessionRevenue(s, st=S){ const c = st.clients.find(x=>x.id===s.clientId); return c ? PACKAGES[c.pkg].per : 80; }
function dayIndex(s){ return Math.round((parse(s.date)-parse(S.weekStart))/DAY); }
function todayIdx(){ return Math.round((today0()-parse(S.weekStart))/DAY); }
function live(s){
  if (s.status==='Cancelled' || s.status==='No-show' || s.status==='Completed') return s.status;
  const d = dayIndex(s), ti = todayIdx(), nm = nowMin();
  if (d < ti || (d===ti && s.start+s.dur <= nm)) return 'Completed';
  if (d===ti && s.start <= nm) return 'In progress';
  return 'Scheduled';
}
const STATUS_PILL = {'Completed':'ok','Scheduled':'info','In progress':'live','Cancelled':'mute','No-show':'bad'};
const billable = s => live(s)!=='Cancelled';

function stats(){
  const byT = {}; for (const t of S.trainers) byT[t.id] = {booked:0,done:0,noshow:0,cx:0,rev:0,clients:0};
  for (const s of S.sessions){ const b = byT[s.trainerId]; if (!b) continue; const L = live(s);
    if (L!=='Cancelled'){ b.booked++; b.rev += sessionRevenue(s); } else b.cx++;
    if (L==='Completed') b.done++; if (L==='No-show') b.noshow++; }
  for (const c of S.clients) if (c.trainerId && byT[c.trainerId] && c.status==='Active') byT[c.trainerId].clients++;
  return byT;
}
function util(t, st){ return t.capacity ? Math.min(1.5, st[t.id].booked / t.capacity) : 0; }

  ].map(x => { const d = daysUntil(x.exp); return {...x, days:d, state: d<0?'bad':d<=30?'warn':'ok'}; });
}
function compWorst(t){ const it = compItems(t); return it.some(x=>x.state==='bad')?'bad':it.some(x=>x.state==='warn')?'warn':'ok'; }
function lastSession(c){ let best = c.lastSeen; for (const s of S.sessions) if (s.clientId===c.id && live(s)==='Completed' && s.date > best) best = s.date; return best; }
function nextSession(c){ return S.sessions.filter(s=>s.clientId===c.id && ['Scheduled','In progress'].includes(live(s))).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start)[0]; }
function clientState(c){

  if (!c.trainerId) return 'Unassigned';

  if (c.remaining <= 2) return 'Renew soon';

function can(k){ const r = role(); if (r==='owner'||r==='admin') return true; const a = S.access[asId]; return a && k in a ? !!a[k] : ROLE_DEFAULTS[r].includes(k); }

function attention(){
  const items = [];
  const comp = {bad:0,warn:0}; for (const t of S.trainers) for (const x of compItems(t)) if (x.state!=='ok') comp[x.state]++;
  const ins = S.trainers.filter(t => daysUntil(t.insExp) <= 30).length;
  const cs = S.clients.map(clientState);
  const risk = cs.filter(x=>x==='At risk').length, renew = cs.filter(x=>x==='Renew soon').length, un = cs.filter(x=>x==='Unassigned').length;
  const overdue = S.work.filter(w=>!w.done && daysUntil(w.due)<0).length;
  const st = stats();
  const over = S.trainers.filter(t => t.status==='Active' && util(t,st) > 1).length;
  const under = S.trainers.filter(t => t.status==='Active' && util(t,st) < .4).length;
  if (comp.bad) items.push({n:comp.bad, s:'bad', t:'Expired credentials', d:'Do not dispatch these trainers until renewed', go:'#compliance'});
  if (risk) items.push({n:risk, s:'bad', t:'Clients at risk', d:'No session in 10+ days and nothing booked', go:'#clients', f:'At risk'});
  if (overdue) items.push({n:overdue, s:'bad', t:'Overdue tickets', d:'Past their due date in Work & Tickets', go:'#work'});
  if (S.leads.length) items.push({n:S.leads.length, s:'warn', t:'New leads waiting', d:'Match each one with a trainer near them', go:'#leads'});
  if (comp.warn) items.push({n:comp.warn, s:'warn', t:'Credentials expiring in 30 days', d:ins+' trainers have liability insurance due', go:'#compliance'});
  if (un) items.push({n:un, s:'warn', t:'Clients without a trainer', d:'Reassign from the client profile', go:'#clients', f:'Unassigned'});
  if (renew) items.push({n:renew, s:'info', t:'Packages ending soon', d:'2 or fewer sessions left. Time to renew.', go:'#clients', f:'Renew soon'});
  if (over) items.push({n:over, s:'info', t:'Trainers over capacity', d:'Booked past their weekly session limit', go:'#trainers', sort:'util'});
  if (under) items.push({n:under, s:'info', t:'Trainers under 40% booked', d:'Good fits for new leads', go:'#trainers', sort:'utilAsc'});
  return items;
}

function hourChart(hours, vals, nm){
  const W=640,H=120,pl=26,pb=20,pt=8; const max=Math.max(4,...vals); const step=Math.ceil(max/4/2)*2||1; const top=step*4;
  const bw=(W-pl)/hours.length, y=v=>pt+(H-pt-pb)*(1-v/top);
  let g=''; for(let v=0;v<=top;v+=step) g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  const cur=Math.floor(nm/60);
  const bars=hours.map((h,i)=>{ const x=pl+i*bw+bw*.18, w=bw*.64, yy=y(vals[i]); const c=h===cur?'var(--lime)':h<cur?'var(--dim)':'var(--cyan)';
    return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-pb-yy)}" rx="3" fill="${c}"><title>${fmtT(h*60)}: ${vals[i]} sessions</title></rect>${i%2===0?`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtT(h*60)}</text>`:''}`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions starting each hour today">${g}${bars}</svg>`;
}
function niceStep(max){ const mag=Math.pow(10,Math.floor(Math.log10(Math.max(1,max)/4))); return Math.ceil(max/4/mag)*mag; }
function revChart(series){
  const W=520,H=230,pl=46,pb=34,pt=16,pr=8; const max=Math.max(...series.map(s=>s.v));
  const step=niceStep(max), top=step*4; const y=v=>pt+(H-pt-pb)*(1-v/top); const bw=(W-pl-pr)/series.length;
  let g=''; for(let v=0;v<=top;v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?'$'+(v/1000)+'k':'$'+v}</text>`;
  const bars=series.map((s,i)=>{ const x=pl+i*bw+bw*.2,w=bw*.6,yy=y(s.v);
    return `<rect x="${x}" y="${yy}" width="${w}" height="${H-pb-yy}" rx="3" fill="url(#rg)" opacity="${s.cur?1:.55}"><title>Week of ${fmtD(s.w)}: ${money(s.v)}</title></rect>${s.cur?`<text x="${x+w/2}" y="${yy-6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--lime)">${moneyK(s.v)}</text>`:''}${i%3===2||s.cur?`<text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle" font-size="10.5" fill="${s.cur?'var(--fg)':'var(--muted)'}">${s.cur?'This wk':fmtD(s.w)}</text>`:''}`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Booked revenue per week"><defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lime)"/><stop offset="1" style="stop-color:var(--cyan)"/></linearGradient></defs>${g}${bars}</svg>`;
}

/* ================= Business: Leads ================= */
function matchesFor(lead){
  const st = stats(); const spec = GOALS[lead.goal].s;
  return S.trainers.filter(t=>t.status!=='On leave' && compWorst(t)!=='bad').map(t => {
    const open = Math.max(0, t.capacity - st[t.id].booked);
    const zoneScore = t.zone===lead.zone ? 40 : NEIGHBORS[lead.zone].includes(t.zone) ? 20 : 0;
    const specScore = t.specs[0]===spec ? 30 : t.specs.includes(spec) ? 24 : 0;
    const score = Math.round(zoneScore + specScore + Math.min(20, open/t.capacity*30) + (t.rating-4.3)*14);
    const why = [];
    if (zoneScore===40) why.push('Covers '+lead.zone); else if (zoneScore) why.push('Next door in '+t.zone);
    if (specScore) why.push(spec+' specialist');
    why.push(open+' open slots', t.rating.toFixed(1)+'★');
    return {t, score:Math.min(99,score), why, open};
  }).filter(m=>m.open>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

/* ================= Business: Payroll ================= */
function payFor(t, st){
  const b = st[t.id]; const ns = b.noshow; const remaining = Math.max(0,b.booked - b.done - ns);
  const base = b.done*t.rate + ns*t.rate*.5; const travel = (b.done+ns)*4;
  const bonus = b.done+remaining>=18 && t.rating>=4.8 ? 75 : 0;
  const toDate = base + travel; const proj = toDate + remaining*(t.rate+4) + bonus;
  return {done:b.done, ns, remaining, base, travel, bonus, toDate, proj, rev:b.rev};
}
function vPayroll(){
  const st = stats(); const rows = S.trainers.filter(t=>t.status!=='On leave').map(t=>({t, p:payFor(t,st)})).sort((a,b)=>b.p.proj-a.p.proj);
  const sum = k => rows.reduce((a,r)=>a+r.p[k],0);
  const rev = sum('rev'), proj = sum('proj'); const margin = rev ? (rev-proj)/rev*100 : 0;

  <section class="panel">
    <div class="panel-h"><h2>Pay period ${fmtD(S.weekStart)} – ${end}</h2><span class="meta">No-shows pay 50% · $4 travel per visit · $75 bonus at 18+ sessions with a 4.8+ rating</span><div class="right"><button class="btn" data-act="csv">Copy as CSV</button></div></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Trainer</th><th class="r">Rate</th><th class="r">Done</th><th class="r">No-show</th><th class="r">Still booked</th><th class="r">Session pay</th><th class="r">Travel</th><th class="r">Bonus</th><th class="r">Earned</th><th class="r">Projected</th></tr></thead>
      <tbody>${rows.map(({t,p})=>`<tr data-act="trainer" data-id="${t.id}"><td><div class="who">${av(t)}<div><b>${esc(fullName(t))}</b><small>${t.id} · ${esc(t.zone)}</small></div></div></td>

      <tr class="total"><td>${rows.length} trainers</td><td></td><td class="r num">${sum('done')}</td><td class="r num">${sum('ns')}</td><td class="r num">${sum('remaining')}</td><td class="r num">${money(sum('base'))}</td><td class="r num">${money(sum('travel'))}</td><td class="r num">${money(sum('bonus'))}</td><td class="r num">${money(sum('toDate'))}</td><td class="r num">${money(proj)}</td></tr>
      </tbody></table></div></section>`;
}
const csvLine = r => r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',');

const ul = (items, max=10) => `<ul>${items.slice(0,max).map(x=>`<li>${x}</li>`).join('')}</ul>${items.length>max?`<div class="muted">…and ${items.length-max} more.</div>`:''}`;
const goBtn = (href,label) => `<a class="btn sm go" href="${href}" data-act="aiGo">${label}</a>`;
function aiAnswer(qRaw){
  const q = qRaw.toLowerCase(); const st = stats(); const ti = todayIdx();
  const zone = ZONES.find(z=>q.includes(z.toLowerCase()));
  let day = /today/.test(q) ? ti : /tomorrow/.test(q) ? ti+1 : DOW_FULL.findIndex(d=>q.includes(d)||new RegExp('\\b'+d.slice(0,3)+'\\b').test(q));
  const slot = /morning|early/.test(q)?'Mornings':/midday|noon|lunch|afternoon/.test(q)?'Midday':/evening|night|after work/.test(q)?'Evenings':null;
  const spec = SPECS.find(s=>SPEC_WORDS[s].test(q));
  if (/free|available|open|who can (take|cover)/.test(q) && !/slot/.test(q.replace('open slots',''))){
    if (day<0) day = ti; if (day>6) return 'I can only see this week\'s schedule. Ask about a day from Monday to Sunday.';
    const date = ymd(addDays(parse(S.weekStart),day)); const [lo,hi] = slot ? SLOTS[slot] : [360,1170];
    const res = S.trainers.filter(t=>t.status!=='On leave'&&compWorst(t)!=='bad'&&(!zone||t.zone===zone||NEIGHBORS[zone].includes(t.zone))&&(!spec||t.specs.includes(spec))).map(t=>{ let first=null; for(let m=lo;m<=hi;m+=30){ if(!conflicts(t.id,date,m,60)){ first=m; break; } } return {t, first, near:zone&&t.zone===zone}; }).filter(x=>x.first!==null && (day!==ti || x.first>nowMin())).sort((a,b)=>b.near-a.near||util(a.t,st)-util(b.t,st));
    if (!res.length) return 'Nobody matching that is free then. Try a neighboring zone or another time of day.';
    return `${res.length} trainers are free ${DOW_FULL[day][0].toUpperCase()+DOW_FULL[day].slice(1)}${slot?' '+slot.toLowerCase():''}${zone?` in or next to ${zone}`:''}${spec?` who do ${spec}`:''}. Least booked first:`+ul(res.map(x=>`<b>${esc(fullName(x.t))}</b> · ${esc(x.t.zone)} · free from ${fmtT(x.first)} · ${st[x.t.id].booked}/${x.t.capacity} booked`),8)+goBtn('#schedule','Open dispatch board');
  }
  if (/cpr|cert|insur|background|expire|compliance|document/.test(q)){
    const k = /cpr|aed/.test(q)?'cpr':/insur/.test(q)?'ins':/background/.test(q)?'bg':/cert/.test(q)?'cert':null;
    const rows = []; for (const t of S.trainers) for (const x of compItems(t)) if ((!k||x.k===k) && (/expir(ing|e soon)|soon|30/.test(q) ? x.state==='warn' : /expired/.test(q) ? x.state==='bad' : x.state!=='ok')) rows.push({t,x});
    rows.sort((a,b)=>a.x.days-b.x.days);
    return rows.length ? `${rows.length} found:`+ul(rows.map(({t,x})=>`<b>${esc(fullName(t))}</b> · ${esc(x.label)} · ${x.days<0?'expired '+fmtD(x.exp):x.days+' days left'}`))+goBtn('#compliance','Open Certifications') : 'Nothing found. Everyone is current for that.';
  }
  if (/top|best|leader|rank|most sessions/.test(q)){
    const r = S.trainers.filter(t=>t.status==='Active').sort((a,b)=>st[b.id].done-st[a.id].done||b.rating-a.rating).slice(0,5);
    return 'Most sessions completed this week:'+ul(r.map((t,i)=>`${i+1}. <b>${esc(fullName(t))}</b> · ${st[t.id].done} done · ${t.rating.toFixed(1)}★ · ${esc(t.zone)}`));
  }
  if (/risk|lapsed|haven.?t (seen|trained)|losing/.test(q)){ const r = S.clients.filter(c=>clientState(c)==='At risk'); return r.length?`${r.length} clients have gone 10+ days without a session and nothing is booked:`+ul(r.map(c=>`<b>${esc(fullName(c))}</b> · last session ${ago(lastSession(c)).toLowerCase()} · ${esc(fullName(T(c.trainerId)))}`))+goBtn('#clients','Open client book'):'No clients are at risk right now.'; }
  if (/renew|ending|package|running out/.test(q)){ const r = S.clients.filter(c=>clientState(c)==='Renew soon'); return `${r.length} clients have 2 or fewer sessions left:`+ul(r.map(c=>`<b>${esc(fullName(c))}</b> · ${c.remaining} left on ${esc(PACKAGES[c.pkg].short)} · ${esc(fullName(T(c.trainerId)))}`))+goBtn('#clients','Open client book'); }
  if (/payroll|pay|wages/.test(q)){ const rows = S.trainers.filter(t=>t.status!=='On leave').map(t=>payFor(t,st)); const tot = k=>rows.reduce((a,p)=>a+p[k],0); return `Trainers have earned <b>${money(tot('toDate'))}</b> so far this week. Projected for the full week: <b>${money(tot('proj'))}</b>, against ${money(tot('rev'))} in booked revenue.`+goBtn('#payroll','Open Trainer Payroll'); }
  if (/revenue|sales|income|made/.test(q)){ const rev = S.sessions.filter(billable).reduce((a,s)=>a+sessionRevenue(s),0); return `Booked revenue this week is <b>${money(rev)}</b> from ${S.sessions.filter(billable).length} sessions.`+goBtn('#dashboard','Open dashboard'); }
  if (/lead/.test(q)){ return S.leads.length?`${S.leads.length} leads are waiting:`+ul(S.leads.map(l=>`<b>${esc(fullName(l))}</b> · ${esc(l.zone)} · ${esc(GOALS[l.goal].g)}`))+goBtn('#leads','Match leads'):'No leads waiting.'; }
  if (/overdue|late|ticket|work/.test(q)){ const r = S.work.filter(w=>!w.done&&daysUntil(w.due)<0); return r.length?`${r.length} overdue tickets:`+ul(r.map(w=>`<b>${esc(w.name)}</b> · ${esc(fullName(P(w.assignee)))} · due ${fmtD(w.due)}`))+goBtn('#work','Open Work & Tickets'):'Nothing is overdue.'; }
  if (zone && /cover|who|trainers? in|work in/.test(q)){ const r = S.trainers.filter(t=>t.zone===zone&&t.status!=='On leave'); return `${r.length} trainers are based in ${zone}:`+ul(r.map(t=>`<b>${esc(fullName(t))}</b> · ${t.specs.join(', ')} · ${st[t.id].booked}/${t.capacity} booked`),12); }
  const words = q.replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const t = S.trainers.find(t=>words.includes(t.last.toLowerCase())&&words.includes(t.first.toLowerCase())) || S.trainers.find(t=>words.includes(t.last.toLowerCase()));
  if (t){ const w = compWorst(t); return `<b>${esc(fullName(t))}</b> · ${t.status} · ${esc(t.zone)} · ${t.specs.join(' & ')}<br>${st[t.id].booked}/${t.capacity} booked this week, ${st[t.id].done} done, ${st[t.id].clients} clients, ${t.rating.toFixed(1)}★. Documents: ${w==='ok'?'all current':w==='warn'?'something expires within 30 days':'<b>something has expired</b>'}. Phone ${esc(t.phone)}.<br><button class="btn sm go" data-act="trainer" data-id="${t.id}">Open profile</button>`; }
  const c = S.clients.find(c=>words.includes(c.last.toLowerCase())&&words.includes(c.first.toLowerCase()));
  if (c){ const nx = nextSession(c); return `<b>${esc(fullName(c))}</b> · ${esc(c.street)}, ${esc(c.zone)} · ${clientState(c)}<br>Trains with ${esc(fullName(T(c.trainerId)))} · ${c.remaining} sessions left on ${esc(PACKAGES[c.pkg].short)} · next session ${nx?DOW[dayIndex(nx)]+' '+fmtT(nx.start):'not booked'}.<br><button class="btn sm go" data-act="client" data-id="${c.id}">Open client</button>`; }
  return 'I didn\'t find an answer for that. I can tell you who is free at a given time and zone, whose documents are expiring, top trainers, at-risk clients, renewals, payroll, revenue, leads and overdue tickets, or look up any trainer or client by name.';
}

function progressChart(c){
  const r = rng(hash(c.id)); const spec = GOALS[c.goal].s; const n = 8;
  let label, unit, v, stepFn;
  if (spec==='Weight Loss'){ label='Body weight'; unit='lb'; v=170+Math.round(r()*70); stepFn=()=>-(0.4+r()*1.6); }
  else if (['Strength','Sports Performance','HIIT','Boxing'].includes(spec)){ label='Goblet squat'; unit='lb'; v=20+Math.round(r()*25); stepFn=()=>r()<.2?0:2.5*(1+Math.floor(r()*2)); }
  else { label='Mobility score'; unit='points'; v=38+Math.round(r()*20); stepFn=()=>Math.round(r()*5); }
  const pts=[]; for(let i=0;i<n;i++){ pts.push(+v.toFixed(1)); v+=stepFn(); }
  const W=440,H=130,pl=40,pr=40,pt=18,pb=22; const lo=Math.min(...pts), hi=Math.max(...pts); const pd=(hi-lo)*.2||2; const a=Math.floor(lo-pd), b=Math.ceil(hi+pd);
  const x=i=>pl+i*(W-pl-pr)/(n-1), y=val=>pt+(H-pt-pb)*(1-(val-a)/(b-a));
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(' ');
  const delta=pts[n-1]-pts[0];
  return `<div class="sec"><h3>${label} · last 8 weeks</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} trend">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cyan);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--cyan);stop-opacity:0"/></linearGradient></defs>
    ${[a,b].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    <path d="${line} L${x(n-1)},${H-pb} L${x(0)},${H-pb} Z" fill="url(#pg)"/><path d="${line}" fill="none" stroke="var(--cyan)" stroke-width="2.5"/>
    <circle cx="${x(n-1)}" cy="${y(pts[n-1])}" r="5" fill="var(--lime)"/><text x="${x(n-1)}" y="${y(pts[n-1])-10}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--lime)">${pts[n-1]}</text>
    <text x="${pl}" y="${H-5}" font-size="10.5" fill="var(--muted)">8 wks ago</text><text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="10.5" fill="var(--muted)">This week</text>
  </svg><p class="note">${delta>=0?'+':''}${delta.toFixed(1)} ${unit} since the first check-in shown. Example trend.</p></div>`;
}

}
function conflicts(trainerId, date, start, dur, exceptId){
  return S.sessions.some(s=>s.id!==exceptId && s.trainerId===trainerId && s.date===date && live(s)!=='Cancelled' && start < s.start+s.dur+30 && start+dur > s.start-30);
}
function sessionModal(id){
  const s = S.sessions.find(x=>x.id===id); if (!s) return; const c = C(s.clientId), t = T(s.trainerId); const L = live(s); const st = stats();
  const dispatcher = can('dispatch'); const mine = s.trainerId===asId;
  const cands = dispatcher ? S.trainers.filter(x=>x.id!==t.id && x.status!=='On leave' && compWorst(x)!=='bad' && !conflicts(x.id,s.date,s.start,s.dur,s.id))
    .sort((a,b)=>(b.zone===c.zone)-(a.zone===c.zone) || (b.specs.includes(s.type))-(a.specs.includes(s.type)) || util(a,st)-util(b,st)).slice(0,15) : [];
  openModal(`<div class="d-h" style="align-items:flex-start"><div><h2>${esc(s.type)} session</h2><p>${fmtD(s.date,{weekday:'long',month:'long',day:'numeric'})} · ${fmtTL(s.start)} – ${fmtTL(s.start+s.dur)}</p></div><button class="x" data-act="close" aria-label="Close">${I.x}</button></div>
    <div class="list">
      <button data-act="${dispatcher?'client':'noop'}" data-id="${c.id}">${av(c)}<span><b>${esc(fullName(c))}</b><br><small>${esc(c.street)}, ${esc(c.zone)}</small></span><span class="end"><small>${esc(PACKAGES[c.pkg].short)} · ${c.remaining} left</small></span></button>
      <button data-act="${can('team')?'trainer':'noop'}" data-id="${t.id}">${av(t)}<span><b>${esc(fullName(t))}</b><br><small>${esc(t.phone)} · ${esc(t.zone)}</small></span><span class="end"><span class="pill ${STATUS_PILL[L]}">${L}</span></span></button>
    </div>
    ${dispatcher||mine?`<div class="actions" style="justify-content:flex-start">
      ${L!=='Completed'?`<button class="btn" data-act="setSess" data-id="${s.id}" data-v="Completed">Mark completed</button>`:''}
      ${L!=='No-show'?`<button class="btn" data-act="setSess" data-id="${s.id}" data-v="No-show">No-show</button>`:''}
      ${L!=='Cancelled'?`<button class="btn danger" data-act="setSess" data-id="${s.id}" data-v="Cancelled">Cancel session</button>`:''}
      ${['Cancelled','No-show','Completed'].includes(s.status)?`<button class="btn ghost" data-act="setSess" data-id="${s.id}" data-v="Scheduled">Undo</button>`:''}</div>`:''}
    ${dispatcher&&L==='Scheduled'?`<div class="sec"><h3>Send a different trainer</h3>
      ${cands.length?`<div class="toolbar"><select id="reassignSess" aria-label="Replacement trainer" style="flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px">${cands.map(x=>`<option value="${x.id}">${esc(fullName(x))} · ${esc(x.zone)}${x.specs.includes(s.type)?' · '+esc(s.type):''} · ${st[x.id].booked}/${x.capacity}</option>`).join('')}</select><button class="btn primary" data-act="reassignSess" data-id="${s.id}">Reassign</button></div>
      <p class="note" style="margin-top:6px">Only trainers free at this time (with a 30-minute travel buffer) and with current documents are listed. Same zone first.</p>`:'<p class="note">No other trainer is free at this time.</p>'}</div>`:''}`);
}
function formModal(kind){
  const zo = ZONES.map(z=>`<option>${z}</option>`).join(''); const so = SPECS.map(s=>`<option>${s}</option>`).join('');
  const go = GOALS.map((g,i)=>`<option value="${i}">${g.g}</option>`).join(''); const po = Object.entries(PACKAGES).map(([k,p])=>`<option value="${k}">${p.name} · ${money(p.per)}/session</option>`).join('');
  const slot = Object.keys(SLOTS).map(s=>`<option>${s}</option>`).join('');
  const f = (id,label,inner,full) => `<label class="field ${full?'full':''}" for="${id}">${label}${inner}</label>`;
  const inp = (id,ph='',type='text',extra='') => `<input id="${id}" name="${id}" type="${type}" placeholder="${ph}" ${extra}>`;
  const sel = (id,opts) => `<select id="${id}" name="${id}">${opts}</select>`;
  const people = STAFF.map(u=>({id:u.id,n:fullName(P(u.id))+' · '+u.title}));
  let title, body;
  if (kind==='trainer'){ title='Add a trainer'; body = f('f_first','First name',inp('f_first','','text','required'))+f('f_last','Last name',inp('f_last','','text','required'))+f('f_zone','Home zone',sel('f_zone',zo))+f('f_cert','Certification',sel('f_cert',CERTS.map(c=>`<option>${c}</option>`).join('')))+f('f_s1','Main specialty',sel('f_s1',so))+f('f_s2','Second specialty',sel('f_s2',SPECS.map((s,i)=>`<option ${i===1?'selected':''}>${s}</option>`).join('')))+f('f_rate','Pay per session ($)',inp('f_rate','','number','value="45" min="20" max="150"'))+f('f_cap','Max sessions per week',inp('f_cap','','number','value="20" min="1" max="45"'))+f('f_phone','Phone',inp('f_phone','(404) 555-0100','tel'),true); }
  else if (kind==='client'){ title='Add a client'; body = f('f_first','First name',inp('f_first','','text','required'))+f('f_last','Last name',inp('f_last','','text','required'))+f('f_street','Street address',inp('f_street','123 Maple Ave','text','required'),true)+f('f_zone','Zone',sel('f_zone',zo))+f('f_slot','Preferred time',sel('f_slot',slot))+f('f_goal','Goal',sel('f_goal',go),true)+f('f_pkg','Package',sel('f_pkg',po),true)+f('f_trainer','Trainer',sel('f_trainer','<option value="">Assign later</option>'+trainerOptions('', ZONES[0])),true); }
  else if (kind==='work'){ title='New ticket'; body = f('f_name','What needs doing',inp('f_name','','text','required'),true)+f('f_area','Area',sel('f_area',AREAS.map(a=>`<option>${a}</option>`).join('')))+f('f_pri','Priority',sel('f_pri','<option>High</option><option selected>Normal</option><option>Low</option>'))+f('f_due','Due',inp('f_due','','date',`value="${ymd(addDays(today0(),1))}"`))+f('f_who','Assign to',sel('f_who',people.map(p=>`<option value="${p.id}" ${p.id===asId?'selected':''}>${esc(p.n)}</option>`).join(''))); }
  else { title='Add a lead'; body = f('f_first','First name',inp('f_first','','text','required'))+f('f_last','Last name',inp('f_last','','text','required'))+f('f_zone','Zone',sel('f_zone',zo))+f('f_slot','Preferred time',sel('f_slot',slot))+f('f_goal','Goal',sel('f_goal',go),true)+f('f_pkg','Interested in',sel('f_pkg',po),true)+f('f_source','Source',sel('f_source',SOURCES.map(s=>`<option>${s}</option>`).join('')))+f('f_note','Notes',inp('f_note','Equipment, injuries, preferences')); }
  openModal(`<div class="d-h"><h2>${title}</h2><button class="x" data-act="close" aria-label="Close">${I.x}</button></div>
    <form id="addForm" data-kind="${kind}"><div class="form">${body}</div><div class="actions" style="margin-top:16px"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`);
}
function copyText(v){
  const fallback = () => { openModal(`<div class="d-h"><h2>Copy this</h2><button class="x" data-act="close" aria-label="Close">${I.x}</button></div><textarea id="copyArea" readonly style="width:100%;min-height:220px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px ui-monospace,monospace">${esc(v)}</textarea><p class="note">Automatic copying was blocked. The text is selected, so press Ctrl+C or ⌘C.</p>`); setTimeout(()=>{const a=$('#copyArea'); if(a){a.focus();a.select();}},30); };
  try { navigator.clipboard.writeText(v).then(()=>toast('Copied'), fallback); } catch(e){ fallback(); }
}

/* ================= events ================= */
const RESULTS = {trainers:trainerRows, clients:clientRows, compliance:compRows, work:workRows, schedule:()=>ui.mode==='board'?boardHtml():weekHtml()};
function refreshResults(){ const fn = RESULTS[currentView()]; const el = $('#results'); if (fn && el) el.innerHTML = fn(); }
function commit(msg){ save(); render(); if (msg) toast(msg); }
function setAs(id){ asId = id; aiLog = []; $('#aiLayer').innerHTML=''; closeLayer(); if (location.hash.slice(1)!==currentView()) location.hash = '#'+currentView(); render(); window.scrollTo(0,0); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.search')) $('#gresults').hidden = true;
  if (!e.target.closest('.me')) { const m = $('#me .menu'); if (m) m.remove(); }
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName==='SELECT' || el.tagName==='INPUT') return;
  switch(a){
    case 'noop': break;
    case 'close': closeLayer(); break;
    case 'trainer': e.preventDefault(); $('#gresults').hidden=true; trainerDrawer(id); break;
    case 'client': e.preventDefault(); $('#gresults').hidden=true; clientDrawer(id); break;
    case 'session': e.preventDefault(); sessionModal(id); break;
    case 'go': {
      const href = el.dataset.href || el.getAttribute('href'); const v = href.slice(1);
      if (v==='clients') Object.assign(ui,{cState:el.dataset.f||'',cQ:'',cZone:'',cTrainer:''});
      if (v==='trainers') Object.assign(ui,{tSort:el.dataset.sort||'name',tStatus:el.dataset.tstatus||(el.dataset.sort?'Active':''),tQ:'',tZone:'',tSpec:''});
      if (v==='compliance') ui.compIssues=true;
      saveUi(); if (el.dataset.href){ location.hash = href; } break; }
    case 'schedToday': ui.day = todayIdx(); ui.mode='board'; saveUi(); break;
    case 'bell': if (can('performance')){ if (location.hash!=='#dashboard') location.hash='#dashboard'; setTimeout(()=>$('#attention')?.scrollIntoView({behavior:'smooth',block:'start'}),60); } else { const al = attention(); location.hash = al[0]?.go || '#today'; } break;
    case 'menu': { const box = $('#me'); const ex = box.querySelector('.menu'); if (ex){ ex.remove(); break; }
      box.insertAdjacentHTML('beforeend', `<div class="menu"><a href="#settings">Settings & appearance</a>${asId!=='U0'?'<button data-act="viewAs" data-id="U0">Back to owner view</button>':''}<button data-act="ai">Ask Declara AI</button><button data-act="reset">Reset sample data</button></div>`); break; }
    case 'viewAs': setAs(id); toast(id==='U0'?'Back to owner view':'Previewing as '+fullName(P(id))); break;
    case 'ai': aiOpen(); break;
    case 'aiClose': $('#aiLayer').innerHTML=''; break;
    case 'aiAsk': aiLog.push({who:'me',q:el.dataset.q},{who:'bot',html:aiAnswer(el.dataset.q)}); aiOpen(); break;
    case 'aiGo': $('#aiLayer').innerHTML=''; break;
    case 'day': ui.day = +el.dataset.i; saveUi(); render(); break;
    case 'mode': ui.mode = el.dataset.m; saveUi(); render(); break;
    case 'viewWeek': ui.mode='week'; ui.sTrainer=id; saveUi(); closeLayer(); if (location.hash!=='#schedule') location.hash='#schedule'; else render(); break;
    case 'moreClients': ui.cLimit += 80; refreshResults(); break;
    case 'compIssues': ui.compIssues = el.dataset.v==='1'; saveUi(); render(); break;
    case 'wShow': ui.wShow = el.dataset.v; saveUi(); render(); break;
    case 'chan': ui.chan = el.dataset.v; saveUi(); render(); break;
    case 'resTab': ui.resTab = el.dataset.v; saveUi(); render(); break;
    case 'repTab': ui.repTab = el.dataset.v; saveUi(); render(); break;
    case 'look': S.look = el.dataset.v; commit(`${LOOKS[S.look].name} look on`); break;
    case 'trainingOf': trainingModal(id); break;
    case 'graduate': { const t = T(id); t.status='Active'; closeLayer(); commit(`${fullName(t)} is now active`); break; }
    case 'addTrainer': formModal('trainer'); break;
    case 'addClient': formModal('client'); break;
    case 'addLead': formModal('lead'); break;
    case 'addWork': formModal('work'); break;
    case 'reset': openModal(`<h2>Reset sample data?</h2><p class="note" style="font-size:15px">This replaces every trainer, client, lead, ticket, message and schedule change saved in this browser with fresh sample data.</p><div class="actions"><button class="btn ghost" data-act="close">Keep my data</button><button class="btn primary" data-act="doReset">Reset</button></div>`); break;
    case 'doReset': lsDel(KEY); S = generate(20261001 + Math.floor(Math.random()*1000)); save(); closeLayer(); setAs('U0'); toast('Sample data reset'); break;
    case 'copy': copyText(el.dataset.v); break;
    case 'csv': copyText(payrollCsv()); break;
    case 'csvProd': copyText(prodCsv()); break;
    case 'toggleLead': ui.openLead = ui.openLead===id ? null : id; render(); break;
    case 'dropLead': { const l = S.leads.find(x=>x.id===id); S.leads = S.leads.filter(x=>x.id!==id); commit(l?`Archived ${fullName(l)}`:''); break; }
    case 'assignLead': {
      const l = S.leads.find(x=>x.id===id), t = T(el.dataset.t); if (!l||!t) break;
      S.clients.push({id:'C'+String(S.nextId.c++).padStart(4,'0'), first:l.first, last:l.last, zone:l.zone, street:'Address pending', trainerId:t.id, pkg:l.pkg, remaining:PACKAGES[l.pkg].size, goal:l.goal, slot:l.slot, status:'Active', lapsed:false, since:ymd(today0()), lastSeen:ymd(today0())});
      const src = S.sales.bySource[l.source]; if (src){ src.signed++; src.consults = Math.max(src.consults, src.signed); src.pkgRev += PACKAGES[l.pkg].per*PACKAGES[l.pkg].size; }
      S.leads = S.leads.filter(x=>x.id!==id); ui.openLead=null;
      commit(`${fullName(l)} assigned to ${fullName(t)}`); break; }
    case 'renew': {
      const t = T(id); const k = el.dataset.k; const t0 = today0();
      if (k==='cert') t.certExp = ymd(addDays(t0,730)); if (k==='cpr') t.cprExp = ymd(addDays(t0,730)); if (k==='bg') t.bgCheck = ymd(t0); if (k==='ins') t.insExp = ymd(addDays(t0,365));
      e.stopPropagation(); commit(`Renewed for ${fullName(t)}`); if (el.dataset.reopen) trainerDrawer(id); break; }
    case 'setSess': {
      const s = S.sessions.find(x=>x.id===id); const c = C(s.clientId); const before = live(s);
      const counted = x => x==='Completed'||x==='No-show';
      s.status = el.dataset.v; const after = live(s);
      if (c && counted(after) && !counted(before)) c.remaining = Math.max(0,c.remaining-1);
      if (c && !counted(after) && counted(before)) c.remaining = Math.min(PACKAGES[c.pkg].size, c.remaining+1);
      commit(`Session marked ${after.toLowerCase()}`); sessionModal(id); break; }
    case 'reassignSess': { const s = S.sessions.find(x=>x.id===id); const nt = $('#reassignSess').value; const t = T(nt); s.trainerId = nt; if (!t.specs.includes(s.type)) s.type = t.specs[0]; commit(`${fullName(t)} is now covering this session`); sessionModal(id); break; }
    case 'togglePause': { const c = C(id); c.status = c.status==='Paused'?'Active':'Paused'; if (c.status==='Paused') S.sessions.forEach(s=>{ if (s.clientId===c.id && live(s)==='Scheduled') s.status='Cancelled'; }); commit(c.status==='Paused'?`${fullName(c)} paused. Upcoming sessions cancelled.`:`${fullName(c)} resumed`); clientDrawer(id); break; }
    case 'renewPkg': { const c = C(id); c.remaining += PACKAGES[c.pkg].size; commit(`Renewed ${PACKAGES[c.pkg].short} for ${fullName(c)}`); clientDrawer(id); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f){ ui[el.dataset.f] = el.value; saveUi(); refreshResults(); return; }
  if (el.dataset.tick){ const k = asId+'|'+ymd(today0()); const s = new Set(S.ticks[k]||[]); el.checked ? s.add(el.dataset.tick) : s.delete(el.dataset.tick); S.ticks = {[k]:[...s], ...Object.fromEntries(Object.entries(S.ticks).filter(([kk])=>kk!==k && kk.endsWith(ymd(today0()))))}; commit(); return; }
  if (el.dataset.done){ const w = S.work.find(x=>x.id===el.dataset.done); w.done = el.checked; commit(w.done?'Ticket done':'Ticket reopened'); return; }
  if (el.dataset.mod){ const t = T(el.dataset.t); t.training[el.dataset.mod] = el.checked; save(); render(); if ($('#layer .modal')) trainingModal(t.id); return; }
  if (el.dataset.access){ const a = S.access[el.dataset.access] ||= {}; a[el.dataset.k] = el.checked; commit('Access updated'); return; }
  const a = el.dataset.actChange;
  if (a==='setStatus'){ const t = T(el.dataset.id); t.status = el.value; commit(`${fullName(t)} set to ${t.status}`); trainerDrawer(t.id); }
  if (a==='reassignClient'){ const c = C(el.dataset.id); const nt = el.value || null; c.trainerId = nt;
    if (nt){ const t = T(nt); S.sessions.forEach(s=>{ if (s.clientId===c.id && live(s)==='Scheduled' && !conflicts(nt,s.date,s.start,s.dur,s.id)){ s.trainerId = nt; if (!t.specs.includes(s.type)) s.type=t.specs[0]; } }); }
    else S.sessions.forEach(s=>{ if (s.clientId===c.id && live(s)==='Scheduled') s.status='Cancelled'; });
    commit(nt?`${fullName(c)} now trains with ${fullName(T(nt))}`:`${fullName(c)} unassigned`); clientDrawer(c.id); }
  if (el.id==='f_zone' && $('#f_trainer')) $('#f_trainer').innerHTML = '<option value="">Assign later</option>'+trainerOptions('', el.value);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && el.type==='search'){ ui[el.dataset.f] = el.value; if (el.dataset.f==='cQ') ui.cLimit=80; saveUi(); refreshResults(); return; }
  if (el.id==='gsearch'){
    const q = el.value.trim().toLowerCase(); const box = $('#gresults');
    if (q.length<2){ box.hidden=true; return; }
    const ts = can('team') ? S.trainers.filter(t=>(fullName(t)+' '+t.id).toLowerCase().includes(q)).slice(0,5).map(t=>`<button data-act="trainer" data-id="${t.id}">${av(t)}<span>${esc(fullName(t))}</span><small>Trainer · ${esc(t.zone)}</small></button>`) : [];
    const pool = can('dispatch') ? S.clients : S.clients.filter(c=>c.trainerId===asId);
    const cs = pool.filter(c=>(fullName(c)+' '+c.id+' '+c.street).toLowerCase().includes(q)).slice(0,5).map(c=>`<button data-act="${can('dispatch')?'client':'noop'}" data-id="${c.id}">${av(c)}<span>${esc(fullName(c))}</span><small>Client · ${esc(c.zone)}</small></button>`);
    box.innerHTML = [...ts,...cs].join('') || '<div class="empty">No matches</div>'; box.hidden=false;
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id==='aiForm'){ const q = $('#aiQ').value.trim(); if (!q) return; aiLog.push({who:'me',q},{who:'bot',html:aiAnswer(q)}); aiOpen(); return; }
  if (f.id==='chatForm'){ const v = $('#chatText').value.trim(); if (!v) return; (S.chat[ui.chan] ||= []).push({by:asId, at:Date.now(), text:v}); commit(); setTimeout(()=>$('#chatText')?.focus(),0); return; }
  if (f.id==='bizForm'){ const fd = Object.fromEntries(new FormData(f)); S.biz = (fd.f_biz||'').trim() || S.biz; S.ownerName = (fd.f_owner||'').trim(); commit('Saved'); return; }
  if (f.id!=='addForm') return;
  const fd = Object.fromEntries(new FormData(f)); const kind = f.dataset.kind; const t0 = today0();
  if (kind==='work'){
    const name = (fd.f_name||'').trim(); if (!name){ toast('Describe the ticket to save it'); return; }
    S.work.push({id:'W'+(S.nextId.w++), name, area:fd.f_area, priority:fd.f_pri, due:fd.f_due||ymd(t0), assignee:fd.f_who, done:false, created:ymd(t0)});
    closeLayer(); commit('Ticket added'); return;
  }
  const first = (fd.f_first||'').trim(), last = (fd.f_last||'').trim();
  if (!first || !last){ toast('Add a first and last name to save'); return; }
  if (kind==='trainer'){
    const training = Object.fromEntries(MODULES.map(m=>[m.id,false]));
    S.trainers.push({id:'T'+String(S.nextId.t++).padStart(3,'0'), first, last, zone:fd.f_zone, specs:[fd.f_s1, fd.f_s2===fd.f_s1 ? SPECS.find(s=>s!==fd.f_s1) : fd.f_s2], cert:fd.f_cert, certExp:ymd(addDays(t0,730)), cprExp:ymd(addDays(t0,730)), bgCheck:ymd(t0), insExp:ymd(addDays(t0,365)), status:'Onboarding', hired:ymd(t0), rate:Math.max(1,+fd.f_rate||45), capacity:Math.max(1,+fd.f_cap||20), radius:12, rating:5.0, phone:(fd.f_phone||'').trim()||'Not provided', training});
    closeLayer(); commit(`${first} ${last} added as onboarding`);
  } else if (kind==='client'){
    S.clients.push({id:'C'+String(S.nextId.c++).padStart(4,'0'), first, last, zone:fd.f_zone, street:(fd.f_street||'').trim()||'Address pending', trainerId:fd.f_trainer||null, pkg:fd.f_pkg, remaining:PACKAGES[fd.f_pkg].size, goal:+fd.f_goal, slot:fd.f_slot, status:'Active', lapsed:false, since:ymd(t0), lastSeen:ymd(t0)});
    closeLayer(); commit(`${first} ${last} added`);
  } else {
    S.leads.unshift({id:'L'+(S.nextId.l++), first, last, zone:fd.f_zone, goal:+fd.f_goal, slot:fd.f_slot, pkg:fd.f_pkg, source:fd.f_source, received:Date.now(), note:(fd.f_note||'').trim()});
    const src = S.sales.bySource[fd.f_source]; if (src) src.leads++;
    closeLayer(); commit('Lead added. Open it to find trainers.');
  }
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeLayer(); $('#aiLayer').innerHTML=''; $('#gresults').hidden=true; } });
window.addEventListener('hashchange', () => { closeLayer(); render(); window.scrollTo(0,0); });

/* ================= boot ================= */
load(); tick(); render();
setInterval(() => {
  tick();
  if (S.weekStart !== ymd(weekStart(new Date()))){ buildWeek(S); save(); }
  const busy = document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if (!busy && !$('#layer').innerHTML && ['dashboard','schedule','today'].includes(currentView())) render(); else renderShell();
}, 60000);
})();
